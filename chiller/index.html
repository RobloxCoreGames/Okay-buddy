<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
// =====================================================================
//  PLANT SIMULATION — 250-ton split screw chiller (30HXA-pattern)
//  Pure JS, no DOM. All internal units SI: °C, kPa(abs), kg, kg/s, kW, s.
// =====================================================================

// ---- R-134a saturation correlations (least-squares fit to NIST data, -20..70 °C) ----
const R134a = {
  psat: T => Math.exp(14.65060697 - 2221.99761539 / (T + 247.64172105)),           // kPa abs
  tsat: P => 2221.99761539 / (14.65060697 - Math.log(Math.max(P, 1))) - 247.64172105,
  rhog: T => Math.exp(-7.14598e-5 * T * T + 0.0346726566 * T + 2.65427177),        // kg/m³ sat. vapor
  rhol: T => -0.0145833 * T * T - 3.22295454 * T + 1296.8197,                      // kg/m³ sat. liquid
  hfg:  T => -0.0045113636 * T * T - 0.7387348485 * T + 199.1998485,               // kJ/kg
  hl:   T => 0.0021742424 * T * T + 1.3352272727 * T + 199.7566667,                // kJ/kg
  cpv: 1.02, cpl: 1.40, k: 1.12,
};
const CPW = 4.186;                 // water kJ/kg·K
const GPM = 0.06309;               // kg/s per US gpm (water)
const C2F = c => c * 1.8 + 32;
const F2C = f => (f - 32) / 1.8;
const dC2dF = d => d * 1.8;
const kPa2psig = p => p * 0.1450377 - 14.696;
const psig2kPa = g => (g + 14.696) / 0.1450377;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const approach = (v, target, rate, dt) => {
  const d = target - v, m = rate * dt;
  return Math.abs(d) <= m ? target : v + Math.sign(d) * m;
};
const lag = (v, target, tau, dt) => v + (target - v) * (1 - Math.exp(-dt / Math.max(tau, 1e-6)));

// ---------------------------------------------------------------------
//  Squirrel-cage induction motor — equivalent-circuit torque/current
//  per-unit: i(s) = 1/sqrt((r/s)^2 + x^2) ; t(s) = i^2 r / s
//  Wye connection: line current & torque are 1/3 of delta values.
// ---------------------------------------------------------------------
class InductionMotor {
  constructor({ name, poles = 2, ratedKW, ratedA, lra = 6, sRated = 0.012, J, mag = 0.32 }) {
    this.name = name;
    this.wSync = 2 * Math.PI * 60 / (poles / 2);
    this.ratedKW = ratedKW; this.ratedA = ratedA;
    this.Trated = ratedKW * 1000 / (this.wSync * (1 - sRated));
    this.x = 1 / lra;
    const a = (1 + Math.sqrt(1 - 4 * this.x * this.x)) / 2;  // r/s at rated point gives t = 1
    this.r = a * sRated;
    this.J = J; this.mag = mag;
    this.w = 0; this.conn = 'off';           // off | wye | delta | gap
    this.freq = 60;                          // supply frequency (VFD-fed motors change it)
    this.voltScale = 1;                      // V/Hz for VFD
    this.transient = 0;                      // reclosing transient multiplier
    this.I = 0; this.T = 0; this.Pelec = 0; this.slip = 1;
  }
  get rpm() { return this.w * 60 / (2 * Math.PI); }
  step(dt, Tload, Vpu) {
    const wS = this.wSync * this.freq / 60;
    let Te = 0, Ipu = 0;
    if (this.conn === 'wye' || this.conn === 'delta') {
      const kv = this.conn === 'wye' ? 1 / 3 : 1;
      const s = wS > 1 ? clamp((wS - this.w) / wS, -0.2, 1) : 1;
      this.slip = s;
      const ss = Math.abs(s) < 1e-4 ? 1e-4 * Math.sign(s || 1) : s;
      // frequency-scaled reactance (VFD at low Hz) — simple V/Hz model
      const fpu = Math.max(this.freq / 60, 0.05);
      const x = this.x * fpu;
      const rr = this.r * (1 + 3.5 * Math.min(Math.abs(ss), 1));   // deep-bar effect
      const i = 1 / Math.sqrt((rr / ss) ** 2 + x * x);
      const v = Vpu * this.voltScale;
      let t = (i * i * rr / ss) / fpu;
      Te = kv * v * v * t * this.Trated;
      Ipu = Math.hypot(kv * v * i, kv * v * this.mag);
      Ipu *= 1 + this.transient;
      this.transient *= Math.exp(-dt / 0.12);
    } else {
      this.slip = 1;
    }
    // load torque always opposes motion; friction keeps it from drifting
    const Tl = this.w > 0.5 ? Tload : Math.min(Tload, Te) * 0.98;
    this.w = Math.max(0, this.w + (Te - Tl) / this.J * dt);
    this.T = Te; this.I = Ipu * this.ratedA;
    this.Pelec = this.conn === 'off' || this.conn === 'gap' ? 0 : Math.max(0, Te * this.w / 1000 / 0.94) + 0.02 * this.ratedKW * (Ipu > 0 ? 1 : 0);
  }
}

// ---------------------------------------------------------------------
//  One refrigerant circuit: twin-screw compressor (06N-pattern), flooded
//  cooler half, EXV, economizer, oil separator, discharge/liquid lines,
//  7-fan air-cooled condenser section on the roof.
// ---------------------------------------------------------------------
class Circuit {
  constructor(id, sim) {
    this.id = id; this.sim = sim;
    // --- compressor ---
    this.Vd = 0.205;                      // m³/s swept at 3550 rpm (≈435 cfm, ~125 tons)
    this.motor = new InductionMotor({ name: 'comp' + id, poles: 2, ratedKW: 160, ratedA: 225, lra: 6.0, sRated: 0.013, J: 0.80, mag: 0.30 });
    this.w0 = this.motor.wSync * (1 - 0.013);
    this.sv = 0.40;                        // slide-valve capacity position (0.40 … 1.00)
    this.L1 = false; this.L2 = false;      // loader solenoids
    this.oilSol = false; this.oilPump = false; this.oilHeater = true;
    this.mcSol = false;                    // motor-cooling solenoid
    this.c1M = false; this.cS = false; this.c2M = false;   // wye-delta contactors
    this.llsv = false;                     // liquid line solenoid (field supplied)
    this.exv = 0;                          // 0..1
    this.exvTarget = 0;
    this.running = false;                  // compressor commanded on (contactors)
    this.state = 'OFF';                    // OFF | PRELUBE | STARTING | RUN | PUMPDOWN
    this.tState = 0; this.tRun = 0;
    this.startT = -1e9; this.stopT = -1e9; this.hours = id === 'A' ? 1520.4 : 1518.9; this.starts = id === 'A' ? 2311 : 2296;
    this.oilDP = 0;                        // oil pressure - economizer pressure (kPa)
    this.Tmotor = 30;                      // °C
    this.oilT = 45;                        // °C oil sump (heater keeps it warm while off)
    // --- refrigerant state ---
    this.Mtot = 154;                       // kg charge in circuit
    this.Mliq = 18;                        // kg liquid held in cooler (after last pumpdown)
    this.MlineFill = 24;                   // liquid line volume to fill (kg)
    this.Tsuc = 16;                        // saturated suction °C
    this.Tcond = 26;                       // saturated condensing °C
    this.Tdgt = 26;                        // discharge gas thermistor reading °C
    this.Tdis = 26;
    this.SC = 8; this.SSH = 0; this.DSH = 0; this.DSHmeas = 0;
    this.mComp = 0; this.mExv = 0; this.Qevap = 0; this.Qcond = 0; this.Pshaft = 0;
    this.PR = 1; this.PRint = 2.1; this.Vi = 2;
    this.flash = 0;                        // liquid-line flashing 0..1 (sight glass bubbles)
    this.carry = 0;
    // --- condenser fans (7 per circuit) ---
    this.fanCmd = new Array(7).fill(false);
    this.fanSpd = new Array(7).fill(0);
    this.fcps1 = false; this.fcps2 = false; this.ats = false;
    // --- noise descriptors (for audio) ---
    this.noise = { roar: 0, pulse: 0, mesh: 0, hum: 0, whine: 0 };
    // --- control bookkeeping ---
    this.pdStartSST = 0; this.pdT = 0;
    this.lowSSTt = 0; this.alarm = null;
    this.exvInt = 0; this.exvHoldUntil = 0;
    this.mcLastSwitch = 0;
    this.liquidValveOpen = 1;              // manual liquid-line service valve (fault injection)
  }

  get Psuc() { return R134a.psat(this.Tsuc); }
  get Pcond() { return R134a.psat(this.Tcond); }
  get L() { return clamp(this.Mliq / 140, 0, 1.2); }
  get capPct() { return this.motor.w > 50 ? Math.round(this.sv * 100) : 0; }
  get compOn() { return this.c1M; }

  // ----- physics step -----
  step(dt, ctx) {
    const sim = this.sim;
    const w = this.motor.w, wr = w / this.w0;
    const Ps = this.Psuc, Pd = this.Pcond;
    const dP = Math.max(Pd - Ps, 0);

    // ---- slide valve hydraulics ----
    const capTarget = 0.40 + (this.L1 ? 0.30 : 0) + (this.L2 ? 0.30 : 0);
    if (capTarget > this.sv + 1e-4) {
      // loading: oil pressure drives the slide piston — fast (~0.5 s for full stroke)
      const oilOK = clamp(this.oilDP / 150, 0, 1);
      this.sv = approach(this.sv, capTarget, 1.25 * oilOK * clamp(wr, 0, 1), dt);
    } else if (capTarget < this.sv - 1e-4 && wr < 0.2) {
      // stopped: return spring pushes the slide home as oil bleeds out of the piston — slow
      const visc = clamp((this.oilT - 20) / 40, 0.15, 1);
      this.sv = approach(this.sv, capTarget, 0.0012 * visc, dt);
    } else if (capTarget < this.sv - 1e-4) {
      // unloading: gas force on the slide bleeds oil back — needs rotation and pressure ratio
      const f = clamp(wr, 0, 1) * clamp((dP - 120) / 520, 0, 1.2) ** 2;
      this.sv = approach(this.sv, capTarget, 0.17 * f, dt);
    }
    this.Vi = 2.0 + 1.2 * (this.sv - 0.4) / 0.6;
    this.PRint = Math.pow(this.Vi, R134a.k);
    this.PR = Pd / Ps;

    // ---- cooler level effects ----
    const L = this.L;
    this.SSH = clamp((0.42 - L) * 40, 0, 12);                  // exposed tubes superheat suction gas
    this.carry = clamp((L - 0.50) * 0.12, 0, 0.08);             // liquid carry-over (froth) when overfed
    const wet = clamp(0.08 + 1.84 * L, 0.05, 1.0);

    // ---- compressor flow & work ----
    const rhoS = R134a.rhog(this.Tsuc) * (273.15 + this.Tsuc) / (273.15 + this.Tsuc + this.SSH);
    const etaV = clamp(0.965 - 0.022 * (this.PR - 1) - 0.06 * (1 - this.sv), 0.3, 0.97);
    const Vdot = this.Vd * clamp(wr, 0, 1.05) * this.sv * etaV;
    this.mComp = rhoS * Vdot;
    const k = R134a.k;
    const vS = 1 / rhoS;
    const wIs = (k / (k - 1)) * Ps * vS * (Math.pow(Math.max(this.PR, 1), (k - 1) / k) - 1); // kJ/kg
    const mis = this.PR - this.PRint;
    const wMis = mis > 0 ? Ps * vS * mis / this.Vi : Ps * vS * (-mis) / this.Vi * 0.35;       // Vi mismatch loss
    const etaIs = 0.83 - 0.10 * (1 - this.sv) / 0.6;
    const wAct = wIs / etaIs + wMis;
    const Pfric = 4.5 * wr * wr + 1.0 * wr;
    this.Pshaft = this.mComp * wAct + Pfric;
    const Tload = w > 5 ? this.Pshaft * 1000 / w : 15;
    this.motor.step(dt, Tload, sim.elec.V);

    // ---- discharge superheat ----
    const mcCool = this.mcSol ? 3.0 : 0;
    const dshDry = 0.30 * Math.max(this.Tcond - this.Tsuc, 0) + 0.75 * this.SSH + 5.5 * (wMis / Math.max(wIs, 1)) + 3.0 * (1 - this.sv) - mcCool + 2.0;
    this.DSH = this.mComp > 0.05 ? Math.max(dshDry - 620 * this.carry, -2) : 0;
    const tdTarget = this.mComp > 0.05 ? this.Tcond + this.DSH : lerp(this.Tdgt, sim.roomT, 0.0);
    if (this.mComp > 0.05) this.Tdis = lag(this.Tdis, tdTarget, 6, dt);
    else this.Tdis = lag(this.Tdis, sim.roomT, 900, dt);
    this.Tdgt = lag(this.Tdgt, this.Tdis, 14, dt);              // thermistor in muffler well
    this.DSHmeas = this.Tdgt - this.Tcond;

    // ---- liquid line / EXV ----
    const Mcl = this.Mtot - this.Mliq - this.MlineFill;         // liquid stacked in condenser
    this.SC = clamp((Mcl - 30) * 0.35, -12, 16);
    // economizer subcooling (brazed plate, active whenever comp runs)
    const econ = this.mComp > 0.3 ? 7.5 * clamp(this.mComp / 2.8, 0, 1) : 0;
    const Tliq = this.Tcond - Math.max(this.SC, 0) - econ;
    this.flash = clamp(-this.SC / 6, 0, 1);
    // liquid head: condenser on roof ~6 m above EXV
    const rhoL = R134a.rhol(Tliq);
    const dPexv = Pd + rhoL * 9.81 * 6.0 / 1000 - 25 - Ps;
    this.exv = approach(this.exv, this.exvTarget, 0.035, dt);  // stepper ~3.5 %/s
    const valveOpen = (this.llsv ? 1 : 0) * this.liquidValveOpen;
    this.mExv = valveOpen * 0.0052 * this.exv * Math.sqrt(Math.max(dPexv, 0) * rhoL) / (1 + 0.35 * Math.max(-this.SC, 0));
    const hIn = R134a.hl(Tliq) + (this.SC < 0 ? -this.SC * 1.6 : 0);
    const hfgS = R134a.hfg(this.Tsuc);
    const xIn = clamp((hIn - R134a.hl(this.Tsuc)) / hfgS, 0, 1);

    // ---- cooler (flooded, water in tubes) ----
    const half = sim.cooler[this.id];
    const F = ctx.FpHalf;                                       // kg/s through this half
    const UA = 78 * wet;                                        // kW/K at full wetting
    let Q;
    if (F > 0.5) {
      const eps = 1 - Math.exp(-UA / (F * CPW));
      Q = eps * F * CPW * (ctx.Tin - this.Tsuc);
    } else {
      Q = 6 * wet * (half.Tw - this.Tsuc);                      // stagnant water, natural convection
    }
    // compressor stopped: vessel is closed; temperature follows the water in the tubes
    if (this.mComp < 0.05 && this.mExv < 0.01) Q = 6 * (half.Tw - this.Tsuc);
    this.Qevap = Q;
    const boil = Q / hfgS;                                       // kg/s vapor from boiling
    const mVin = this.mExv * xIn + boil;
    const mVout = this.mComp * (1 - this.carry);
    this.Mliq = Math.max(0, this.Mliq + (this.mExv * (1 - xIn) - boil - this.mComp * this.carry) * dt);
    const Ceff = 0.42 * 0.6 + (this.Mliq * R134a.cpl + 140) / hfgS;  // kg per K (vapor space + liquid & shell flash)
    this.Tsuc += (mVin - mVout) / Ceff * dt;
    this.Tsuc = clamp(this.Tsuc, -30, 60);

    // ---- condenser on roof ----
    const T_amb = sim.oat + 1.5;                                 // roof air a bit hotter than OAT
    let UAc = 0.9;
    for (let i = 0; i < 7; i++) {
      this.fanSpd[i] = lag(this.fanSpd[i], this.fanCmd[i] && sim.condFanBreaker ? 1 : 0, this.fanCmd[i] ? 2.5 : 9, dt);
      UAc += 5.1 * this.fanSpd[i];
    }
    this.Qcond = UAc * (this.Tcond - T_amb);
    const qIn = this.mComp * (R134a.hfg(this.Tcond) + R134a.cpv * Math.max(this.DSH, 0) + R134a.cpl * Math.max(this.SC, 0));
    const Ccond = 820;                                          // kJ/K coil + discharge line + vapor
    this.Tcond += (qIn - this.Qcond) / Ccond * dt;
    // condenser can't sit below the cooler while the system is open (EXV path equalises slowly)
    if (this.Tcond < this.Tsuc && valveOpen > 0 && this.exv > 0.02) this.Tcond = lag(this.Tcond, this.Tsuc, 30, dt);

    // ---- oil system ----
    const pumpDP = this.oilPump ? 260 : 0;
    const sysDP = this.oilSol && w > 50 ? Math.max(0, (Pd - Ps) * 0.55 - 40) : 0;
    const tgt = this.oilSol || this.oilPump ? Math.max(pumpDP * (this.oilSol || !this.running ? 1 : 1), sysDP + pumpDP * 0.5) : 0;
    this.oilDP = lag(this.oilDP, tgt, 1.2, dt);

    // ---- oil temperature (heater when off, discharge-heated when running) ----
    this.oilT = lag(this.oilT, this.running ? this.Tdis - 5 : (this.oilHeater ? 46 : sim.roomT), this.running ? 120 : 1800, dt);
    this.oilHeater = !this.running;
    // ---- motor temperature ----
    const loss = this.motor.Pelec * 0.06 + (this.motor.I > 2 * this.motor.ratedA ? 6 : 0);
    const cool = (this.mComp * 6 + 0.25) * (this.Tmotor - this.Tsuc) / 10 + (this.mcSol ? 9 * (this.Tmotor - this.Tsuc) / 40 : 0) + 0.05 * (this.Tmotor - sim.roomT);
    this.Tmotor += (loss - cool) / 95 * dt;

    // ---- noise descriptors ----
    const wr2 = wr * wr;
    const u = clamp((1 - this.sv) / 0.6, 0, 1);
    const byp = u * Math.sqrt(dP / 700) * clamp(rhoS / 16, 0, 2) * wr2;
    const puls = Math.abs(mis) / this.PRint * wr2;
    this.noise.roar = 0.22 * wr2 * (0.6 + 0.4 * this.mComp / 2.8) + 0.95 * byp + 0.25 * puls;
    this.noise.pulse = 0.18 * wr2 + 0.8 * puls + 0.35 * byp;
    this.noise.mesh = 0.25 * wr2;
    const v = sim.elec.V;
    this.noise.hum = this.motor.conn === 'delta' ? 0.35 * v : this.motor.conn === 'wye' ? 0.12 * v : 0;
    this.noise.lobeHz = 4 * this.motor.rpm / 60;               // 4-lobe male rotor
    this.noise.rotHz = this.motor.rpm / 60;
  }
}

// ---------------------------------------------------------------------
//  The whole plant
// ---------------------------------------------------------------------
class Plant {
  constructor() {
    this.t = 0;                            // sim seconds since start
    this.clock = 6 * 3600 + 58 * 60 + 40;  // time of day (s) — 06:58:40
    this.events = [];                      // {type, src, gain}
    this.oat = F2C(80); this.oatOffset = 0; this.oatManual = null;
    this.roomT = F2C(82);
    this.condFanBreaker = true;
    this.mainBreaker = true; this.chillerDisc = true;
    this.ctlPowered = true; this.ctlBoot = 0; this.basPowered = true; this.basBoot = 0;
    this.elec = { V: 1, Vslow: 1, I: 0, light: 1, base: 160 };

    // --- circuits & cooler ---
    this.A = new Circuit('A', this);
    this.B = new Circuit('B', this);
    this.circuits = [this.A, this.B];
    this.cooler = { A: { Tw: F2C(64) }, B: { Tw: F2C(64) } };
    this.lwtSensor = F2C(64); this.ewtSensor = F2C(64);

    // --- primary chilled water pump (constant speed, across-the-line) ---
    this.P1 = { motor: new InductionMotor({ name: 'P1', poles: 4, ratedKW: 11.2, ratedA: 21, lra: 6.5, sRated: 0.025, J: 0.11, mag: 0.4 }),
                hoa: 'AUTO', cmd: false, flow: 0, contactor: false };
    // --- secondary distribution pump on VFD ---
    this.P2 = { motor: new InductionMotor({ name: 'P2', poles: 4, ratedKW: 18.6, ratedA: 34, lra: 6.5, sRated: 0.02, J: 0.25, mag: 0.4 }),
                hoa: 'AUTO', run: false, hz: 0, hzCmd: 0, flow: 0 };
    this.P2.motor.freq = 0;
    this.vfd = { accel: 60 / 20, decel: 60 / 7, minHz: 12, maxHz: 60, I: 0, kW: 0, dcBus: 650, fault: null, running: false };
    this.isoValve = 1; this.isoValveCmd = 1;   // evaporator CHW isolation valve (manual gear operator)
    this.flowSwitch = false; this.fsT = 0;

    // --- water loop & building ---
    this.Tsup = F2C(64); this.Tret = F2C(65);   // supply & return mains (tank temps)
    this.Tzone = F2C(76.5);
    this.valve = 0;                            // aggregate AHU coil valve 0..1
    this.valveInt = 0;
    this.Qcoil = 0; this.Fp = 0; this.Fs = 0;
    this.ahuOn = false; this.ahuSpd = 0;

    // --- ComfortLink controller ---
    this.ctl = {
      switch: 'REMOTE',                  // ENABLE | OFF | REMOTE
      estop: true,                       // emergency on/off switch (true = ON)
      remote: false,                     // remote contact (from BAS)
      setpoint: F2C(44),                 // CSP.1
      stage: 0, smz: 0, tick: 2 + Math.random() * 28, lastStep: -999, lastLwt: F2C(64), rate: 0,
      mode: 'OFF', pending: null, stopping: false, alarms: [], history: [],
      lead: 'A', lastStageChangeReason: '', rampLimit: 1.0, zgain: 1.0,
      loaderDelay: 30, capacityPct: 0, ctpt: F2C(44), startDelay: 0, dsMinOff: 0,
    };
    // --- BAS ---
    this.bas = { mode: 'AUTO', occ: false, seq: 'OFF', t: 0, offDelay: 105, speedCmd: 0, dpSP: 12, dp: 0 };
  }

  get oatF() { return C2F(this.oat); }

  ev(type, src, gain = 1) { this.events.push({ type, src, gain }); }

  // ---------------- outdoor weather (daily curve) ----------------
  updateWeather() {
    const h = (this.clock / 3600) % 24;
    const base = 77 + 13 * Math.sin((h - 9) / 24 * 2 * Math.PI) * (h > 5 && h < 21 ? 1 : 0.6);
    const f = this.oatManual != null ? this.oatManual : base + this.oatOffset;
    this.oat = F2C(f);
  }

  // ---------------- electrical bus ----------------
  updateElectrical(dt) {
    const e = this.elec;
    let I = e.base + (this.ahuOn ? 38 * this.ahuSpd ** 3 : 0) + 6;
    for (const c of this.circuits) I += c.motor.I + (c.oilPump ? 2.5 : 0);
    I += this.P1.motor.I;
    I += this.vfd.I * 0.95;
    e.I = I;
    const Z = 0.026;                        // ohms — service + transformer impedance at 277 V phase
    e.V = this.mainBreaker ? 1 - I * Z / 277 : 0;
    if (!this.mainBreaker) { e.I = 0; e.Vslow = lag(e.Vslow, 1, 1, dt); e.light = 0; return; }
    e.Vslow = lag(e.Vslow, e.V, 6, dt);
    // fluorescent output ≈ V^3 ; relative to slow-moving supply (what eyes notice)
    const target = Math.pow(e.V / e.Vslow, 3.2);
    e.light = lag(e.light, target, 0.035, dt);
  }

  // ---------------- water side ----------------
  updateWater(dt) {
    const P1 = this.P1, P2 = this.P2, vfd = this.vfd;
    // valve operator moves slowly (gear handwheel)
    this.isoValve = approach(this.isoValve, this.isoValveCmd, 1 / 12, dt);
    const isoF = this.isoValve <= 0.02 ? 0 : Math.sqrt(this.isoValve) * (1 - 0.15 * (1 - this.isoValve));
    // primary pump hydraulics: Q ∝ speed, loads motor with ρgQH/η
    const n1 = P1.motor.w / (P1.motor.wSync * 0.975);
    const Fp_target = 600 * GPM * clamp(n1, 0, 1.05) * isoF;
    this.Fp = lag(this.Fp, Fp_target, 1.6, dt);
    const H1 = 17.5 * n1 * n1;              // m head
    const Tl1 = P1.motor.w > 1 ? (1000 * 9.81 * (this.Fp / 1000) * H1 / 0.70) / P1.motor.w + 2 * n1 : 2;
    P1.motor.conn = P1.contactor && this.mainBreaker ? 'delta' : 'off';
    P1.motor.step(dt, Tl1, this.elec.V);

    // VFD + secondary pump
    vfd.running = P2.run;
    const hzTarget = P2.run ? clamp(P2.hzCmd, vfd.minHz, vfd.maxHz) : 0;
    if (!this.mainBreaker) { P2.hz = 0; P2.run = false; }
    else P2.hz = P2.hz < hzTarget ? approach(P2.hz, hzTarget, vfd.accel, dt) : approach(P2.hz, hzTarget, vfd.decel, dt);
    const m2 = P2.motor;
    m2.freq = P2.hz; m2.voltScale = clamp(P2.hz / 60, 0, 1) * 0.97 + (P2.hz > 0 ? 0.03 : 0);
    m2.conn = P2.hz > 0.2 ? 'delta' : 'off';
    const n2 = m2.w / (m2.wSync * 0.98);
    const vEff = clamp(this.valve, 0.06, 1);
    const Fs_target = 640 * GPM * clamp(n2, 0, 1.05) * Math.sqrt(vEff) * 1.02;
    this.Fs = lag(this.Fs, Fs_target, 2.5, dt);
    const H2 = 26 * n2 * n2;
    const Tl2 = m2.w > 1 ? (1000 * 9.81 * (this.Fs / 1000) * H2 / 0.72) / m2.w + 1.5 * n2 : 1.5;
    m2.step(dt, Tl2, this.elec.V);
    vfd.kW = m2.Pelec / 0.97 + (P2.run ? 0.25 : 0.05);
    vfd.I = vfd.kW * 1000 / (Math.sqrt(3) * 480 * this.elec.V * 0.95);
    this.bas.dp = Math.max(0, H2 * 1.42 - 8 * (this.Fs / (640 * GPM)) ** 2 * 1.42) * 0.65; // psi at remote sensor (rough)

    // flow switch (thermal dispersion) — slow to make, slower to drop
    const proven = this.Fp > 0.45 * 600 * GPM;
    if (proven !== this.flowSwitch) { this.fsT += dt; if (this.fsT > (proven ? 4.5 : 2.5)) { this.flowSwitch = proven; this.fsT = 0; this.ev('relay', 'flowswitch', 0.2); } }
    else this.fsT = 0;

    // ---- loop thermal network ----
    const Fp = this.Fp, Fs = this.Fs;
    const lwt = (this.cooler.A.Tw + this.cooler.B.Tw) / 2;
    let Tevap_in, TsupIn;
    if (Fp >= Fs) {
      Tevap_in = Fp > 0.1 ? (Fs * this.Tret + (Fp - Fs) * lwt) / Fp : this.Tret;
      TsupIn = lwt;
    } else {
      Tevap_in = this.Tret;
      TsupIn = Fs > 0.1 ? (Fp * lwt + (Fs - Fp) * this.Tret) / Fs : this.Tsup;
    }
    this.Tevap_in = Tevap_in;
    // cooler halves (water in tubes)
    for (const c of this.circuits) {
      const h = this.cooler[c.id];
      const F = Fp / 2;
      const Mw = 105;                                             // kg water per half
      const dT = (F * CPW * (Tevap_in - h.Tw) - c.Qevap + 0.15 * (this.roomT - h.Tw)) / (Mw * CPW);
      h.Tw += dT * dt;
    }
    // building coils & mains
    const Ms = 2600, Mr = 3800;           // kg in supply / return mains
    const Fs_ = Math.max(Fs, 0.05);
    const coilCap = this.ahuOn ? this.valve * 52 * this.ahuSpd * Math.max(this.Tzone - this.Tsup, 0) : 0;
    const waterCap = Fs_ * CPW * Math.max(this.Tzone - 0.8 - this.Tsup, 0);
    this.Qcoil = Math.min(coilCap, waterCap);
    const TretBldg = this.Tsup + this.Qcoil / (Fs_ * CPW);
    this.Tsup += (Fs * (TsupIn - this.Tsup) + 0.35 * (this.roomT - this.Tsup)) / (Ms * CPW) * CPW * dt;
    this.Tret += (Fs * (TretBldg - this.Tret) + (Fp > Fs ? 0 : 0) + 0.45 * (this.Tzone - this.Tret)) / (Mr * CPW) * CPW * dt;
    // the decoupler leg also exchanges heat with return when primary > secondary
    if (Fp > Fs) this.Tret += (Fp - Fs) * (lwt - this.Tret) / Mr * dt * 0.0; // (mixing handled at evap inlet)
    // building zone
    const occ = this.bas.occ;
    const h = (this.clock / 3600) % 24;
    const solar = Math.max(0, Math.sin((h - 6.5) / 13 * Math.PI)) * 140;
    const Qint = (occ ? 300 : 55) + solar;
    const Qenv = 13 * (this.oat - this.Tzone);
    const Cb = 260000;                    // kJ/K effective building mass
    this.Tzone += (Qint + Qenv - this.Qcoil) / Cb * dt;
    // AHU valve control (PI on zone temperature)
    const zsp = F2C(72.5);
    if (this.ahuOn) {
      const err = this.Tzone - zsp;
      this.valveInt = clamp(this.valveInt + err * 0.0009 * dt, 0, 1);
      this.valve = clamp(0.35 * err + this.valveInt, 0, 1);
    } else { this.valve = lag(this.valve, 0, 5, dt); }
  }

  // ---------------- sensors ----------------
  updateSensors(dt) {
    const lwt = (this.cooler.A.Tw + this.cooler.B.Tw) / 2;
    this.lwtSensor = lag(this.lwtSensor, lwt, 7, dt);
    this.ewtSensor = lag(this.ewtSensor, this.Tevap_in ?? this.Tret, 7, dt);
  }

  // =====================================================================
  //  BAS — chilled water plant sequence (field programmed, not Carrier)
  // =====================================================================
  updateBAS(dt) {
    const b = this.bas, P1 = this.P1, P2 = this.P2;
    if (!this.mainBreaker) {
      this.basPowered = false; b.seq = 'OFF'; b.t = 0; P1.cmd = false; P2.run = false; this.ctl.remote = false;
      if (P1.contactor) { P1.contactor = false; this.ev('contactor', 'P1', 0.5); }
      this.ahuOn = false; this.ahuSpd = lag(this.ahuSpd, 0, 6, dt); P2.hzCmd = 0;
      return;
    }
    if (!this.basPowered) { this.basPowered = true; this.basBoot = 25; }
    if (this.basBoot > 0) { this.basBoot -= dt; P1.cmd = false; P2.run = false; this.ctl.remote = false; this.ahuOn = false; this.ahuSpd = lag(this.ahuSpd, 0, 6, dt); return; }
    const h = (this.clock / 3600) % 24;
    const sched = h >= 7 && h < 16.5;
    b.occ = b.mode === 'OCC' ? true : b.mode === 'UNOCC' ? false : sched;
    b.t += dt;
    const go = (s) => { b.seq = s; b.t = 0; };
    switch (b.seq) {
      case 'OFF':
        P1.cmd = false; P2.run = false; this.ctl.remote = false;
        if (b.occ) { go('START_P1'); this.ev('relay', 'bas', 0.4); }
        break;
      case 'START_P1':
        P1.cmd = true;
        if (b.t > 20 && this.flowSwitch) { go('START_P2'); this.ev('relay', 'bas', 0.4); }
        if (!b.occ) go('STOP_WAIT');
        break;
      case 'START_P2':
        P2.run = true; this.ctl.remote = true;
        b.speedCmd = 0.86;
        if (b.t > 25) go('RUN');
        if (!b.occ) go('STOP_WAIT');
        break;
      case 'RUN': {
        P1.cmd = true; P2.run = true; this.ctl.remote = true;
        // DP reset loop: tiny, slow trim — VFD sounds essentially constant
        const err = (b.dpSP - b.dp);
        b.speedCmd = clamp(b.speedCmd + err * 0.00025 * dt, 0.55, 1.0);
        if (!b.occ) { go('STOP_WAIT'); this.ev('relay', 'bas', 0.5); }
        break;
      }
      case 'STOP_WAIT':
        // drop chiller enable, secondary to minimum speed, wait for compressors to finish
        this.ctl.remote = false; b.speedCmd = 0.2;
        if (!this.A.compOn && !this.B.compOn && this.ctl.mode !== 'PUMPDOWN') { go('OFF_DELAY'); }
        if (b.occ) go('RUN');
        break;
      case 'OFF_DELAY':
        b.speedCmd = 0.2;
        if (b.t > b.offDelay) { go('OFF'); P1.cmd = false; P2.run = false; this.ev('relay', 'bas', 0.4); }
        if (b.occ) go('RUN');
        break;
    }
    // hand/off/auto at starters
    const p1Run = P1.hoa === 'HAND' || (P1.hoa === 'AUTO' && P1.cmd);
    if (p1Run !== P1.contactor) { P1.contactor = p1Run; this.ev(p1Run ? 'thud' : 'contactor', 'P1', p1Run ? 1 : 0.6); }
    const p2Run = P2.hoa === 'HAND' || (P2.hoa === 'AUTO' && P2.run);
    P2.run = p2Run;
    P2.hzCmd = P2.hoa === 'HAND' ? 45 : b.speedCmd * 60;
    this.ahuOn = b.occ && this.flowSwitch;
    this.ahuSpd = lag(this.ahuSpd, this.ahuOn ? 1 : 0, 12, dt);
  }

  // =====================================================================
  //  ComfortLink-pattern unit controller
  // =====================================================================
  alarm(code, text, circ = null) {
    const c = this.ctl;
    if (c.alarms.find(a => a.code === code)) return;
    const a = { code, text, t: this.clock };
    c.alarms.push(a); c.history.unshift(a); c.history.length = Math.min(c.history.length, 20);
    this.ev('alarm', 'chiller', 1);
  }
  resetAlarms() { this.ctl.alarms = []; for (const c of this.circuits) c.alarm = null; this.ev('relay', 'chiller', 0.3); }

  unitEnabled() {
    const c = this.ctl;
    if (!c.estop) return false;
    if (c.switch === 'ENABLE') return true;
    if (c.switch === 'REMOTE') return c.remote;
    return false;
  }

  // stage table: [capA, capB] relative to lead/lag
  stageCaps(stage) {
    const T = [[0, 0], [0.4, 0], [0.7, 0], [1, 0], [1, 0.4], [1, 0.7], [1, 1]];
    return T[clamp(stage, 0, 6)];
  }
  leadLag() { return this.ctl.lead === 'A' ? [this.A, this.B] : [this.B, this.A]; }

  // start a compressor (prelube → wye → delta)
  requestStart(c) {
    if (c.state !== 'OFF') return;
    c.state = 'PRELUBE'; c.tState = 0;
    c.L1 = c.L2 = false;                                   // loaders off before start
    c.oilPump = true; this.ev('relay', 'oilpump' + c.id, 0.3);
  }
  stopCompressor(c, reason, abrupt = false) {
    if (c.c1M || c.cS || c.c2M) this.ev('contactor', 'comp' + c.id, 1.0);
    c.c1M = c.cS = c.c2M = false; c.motor.conn = 'off';
    c.llsv = false; c.exvTarget = 0; c.oilSol = false; c.oilPump = false; c.mcSol = false;
    if (abrupt) { c.exv = 0; }
    if (c.L1 || c.L2) this.ev('solenoid', 'loader' + c.id, 0.4);
    c.L1 = c.L2 = false;
    c.running = false; c.state = 'OFF'; c.tState = 0; c.stopT = this.t;
    for (let i = 0; i < 7; i++) c.fanCmd[i] = false;
    c.lastStop = reason;
    this.ev('solenoid', 'llsv' + c.id, 0.8);
  }

  updateCompressorSequencer(c, dt) {
    c.tState += dt;
    const set = (L1, L2) => {
      if (L1 !== c.L1) this.ev('solenoid', 'loader' + c.id, 0.55);
      if (L2 !== c.L2) this.ev('solenoid', 'loader' + c.id, 0.55);
      c.L1 = L1; c.L2 = L2;
    };
    switch (c.state) {
      case 'PRELUBE':
        // Oil pump 20 s → oil solenoid → 15 s → start (per 30HX start-up sequence)
        if (!c.oilSol && c.tState >= 20) { c.oilSol = true; this.ev('solenoid', 'oil' + c.id, 0.5); }
        if (c.tState >= 35) {
          if (c.oilDP < 90) { this.stopCompressor(c, 'LOW OIL PRESSURE'); this.alarm('T' + (c.id === 'A' ? '051' : '055'), `CIRCUIT ${c.id} COMP 1 LOW OIL PRESSURE`); return; }
          // close 1M + S → motor in WYE
          c.c1M = true; c.cS = true; c.motor.conn = 'wye';
          c.wyeTime = 1.0 + Math.random() * 0.5;               // field-observed 1–1.5 s wye dwell
          c.llsv = true; c.exvTarget = 0.26; c.exvHoldUntil = this.t + 75;
          c.state = 'STARTING'; c.tState = 0; c.running = true; c.startT = this.t; c.starts++;
          c.fanCmd[0] = c.fanCmd[1] = true;
          this.ev('contactor', 'comp' + c.id, 1.0); this.ev('solenoid', 'llsv' + c.id, 0.8);
        }
        break;
      case 'STARTING':
        // wye run → open transition → delta  (field-observed transition ≈ 1.2–1.5 s)
        if (c.cS && c.tState >= c.wyeTime) { c.cS = false; c.motor.conn = 'gap'; this.ev('contactor', 'compS' + c.id, 0.7); }
        if (!c.cS && !c.c2M && c.tState >= c.wyeTime + 0.05) {
          c.c2M = true; c.motor.conn = 'delta'; c.motor.transient = 0.8; this.ev('contactor', 'comp' + c.id, 0.9);
        }
        if (c.c2M && c.tState > c.wyeTime + 1.5) { c.state = 'RUN'; c.tRun = 0; }
        break;
      case 'RUN':
        c.tRun += dt;
        if (c.tRun > 120 && c.oilPump) { c.oilPump = false; this.ev('relay', 'oilpump' + c.id, 0.25); }
        break;
      case 'PUMPDOWN':
        c.pdT += dt;
        if (c.Tsuc < F2C(10) || (c.Tsuc <= c.pdStartSST - 5.56 && c.L < 0.05)) { this.stopCompressor(c, 'PUMPDOWN COMPLETE'); }
        else if (c.pdT > 360) { this.alarm(c.id === 'A' ? 'T136' : 'T137', `CIRCUIT ${c.id} FAILURE TO PUMP OUT`); this.stopCompressor(c, 'PUMPOUT TIMEOUT'); }
        break;
    }
    // ---- EXV control: discharge superheat PI (DSH set point 22 °F) ----
    if (c.running && c.state !== 'PUMPDOWN') {
      if (this.t > c.exvHoldUntil) {
        if (!c.exvPid) { c.exvPid = true; c.exvInt = c.exvTarget; }
        const sp = 22 / 1.8;                         // DSH set point 22 °F (Carrier default)
        const err = c.DSHmeas - sp;                  // positive: too much superheat → open
        c.exvInt = clamp(c.exvInt + err * 0.00012 * dt, 0.06, 1.0);
        let tgt = clamp(c.exvInt + err * 0.016, 0.06, 1.0);
        // MOP: limit feed when suction is very warm
        if (c.Tsuc > F2C(55)) tgt = Math.min(tgt, c.exv);
        c.exvTarget = tgt;
      } else c.exvPid = false;
    } else if (c.state === 'PUMPDOWN') { c.exvTarget = 0; }
    // ---- motor cooling solenoid (200 °F set point) ----
    if (c.running && this.t - c.mcLastSwitch > 4) {
      if (!c.mcSol && c.Tmotor > F2C(200)) { c.mcSol = true; c.mcLastSwitch = this.t; this.ev('solenoid', 'mc' + c.id, 0.3); }
      else if (c.mcSol && c.Tmotor < F2C(193)) { c.mcSol = false; c.mcLastSwitch = this.t; this.ev('solenoid', 'mc' + c.id, 0.3); }
    }
    // ---- condenser fan staging (09D-pattern switches, 7 fans this circuit) ----
    if (c.running) {
      const psig = kPa2psig(c.Pcond), oatF = this.oatF;
      if (psig > 185) c.fcps1 = true; else if (psig < 97) c.fcps1 = false;
      if (psig > 205) c.fcps2 = true; else if (psig < 150) c.fcps2 = false;
      if (oatF > 80) c.ats = true; else if (oatF < 70) c.ats = false;
      c.fanCmd[0] = c.fanCmd[1] = true;
      c.fanCmd[2] = c.fanCmd[3] = c.fcps1;
      c.fanCmd[4] = c.fanCmd[5] = c.ats;
      c.fanCmd[6] = c.fcps2;
    }
    // ---- safeties ----
    if (c.running) {
      const sctF = C2F(c.Tcond);
      if (kPa2psig(c.Pcond) > 300) { this.alarm(c.id === 'A' ? 'T051' : 'T055', `CIRCUIT ${c.id} COMP 1 FAILURE-HIGH PRESSURE SWITCH TRIP`); this.stopCompressor(c, 'HPS', true); return; }
      if (C2F(c.Tsuc) < 28 && c.state === 'RUN') { c.lowSSTt += dt; } else c.lowSSTt = Math.max(0, c.lowSSTt - dt);
      if (c.lowSSTt > 180) { this.alarm(c.id === 'A' ? 'A140' : 'A141', `CIRCUIT ${c.id} LOW SATURATED SUCTION TEMPERATURE`); this.stopCompressor(c, 'LOW SST', true); return; }
      if (c.state === 'RUN' && c.tRun > 30 && kPa2psig(c.Psuc) < 5) { this.alarm(c.id === 'A' ? 'A150' : 'A151', `CIRCUIT ${c.id} LOSS OF CHARGE`); this.stopCompressor(c, 'LOSS OF CHARGE', true); return; }
      if (c.Tmotor > F2C(245)) { this.alarm(c.id === 'A' ? 'T051' : 'T055', `CIRCUIT ${c.id} COMP 1 HIGH MOTOR TEMPERATURE`); this.stopCompressor(c, 'MOTOR TEMP', true); return; }
      if (sctF > 150) { c.highSCTt = (c.highSCTt || 0) + dt; } else c.highSCTt = 0;
    }
  }

  updateController(dt) {
    const c = this.ctl;
    const chPow = this.mainBreaker && this.chillerDisc;
    if (!chPow) {
      if (this.ctlPowered) {
        for (const k of this.circuits) if (k.state !== 'OFF' || k.c1M) this.stopCompressor(k, 'POWER LOSS', true);
        c.mode = 'OFF'; c.stage = 0; c.smz = 0; this.ctlPowered = false;
      }
      for (const k of this.circuits) { k.oilHeater = false; for (let i = 0; i < 7; i++) k.fanCmd[i] = false; }
      return;
    }
    if (!this.ctlPowered) { this.ctlPowered = true; this.ctlBoot = 75; this.ev('relay', 'chiller', 0.3); }
    if (this.ctlBoot > 0) { this.ctlBoot -= dt; c.mode = 'OFF'; return; }
    const en = this.unitEnabled() && c.alarms.filter(a => a.code.startsWith('A2')).length === 0;
    const [lead, lag_] = this.leadLag();

    // emergency switch: everything drops out instantly (slide valves stay where they were)
    if (!c.estop) {
      for (const k of this.circuits) if (k.state !== 'OFF') this.stopCompressor(k, 'EMERGENCY STOP', true);
      c.stage = 0; c.mode = 'OFF'; c.smz = 0;
    }
    for (const k of this.circuits) this.updateCompressorSequencer(k, dt);

    // flow switch / pump interlock
    const anyOn = this.circuits.some(k => k.state !== 'OFF');
    if (anyOn && !this.flowSwitch) {
      c.noFlowT = (c.noFlowT || 0) + dt;
      if (c.noFlowT > 10) {
        this.alarm('A201', 'COOLER PUMP INTERLOCK OPENED DURING NORMAL OPERATION');
        for (const k of this.circuits) this.stopCompressor(k, 'FLOW LOSS', true);
        c.stage = 0;
      }
    } else c.noFlowT = 0;
    if (en && !this.flowSwitch && c.mode === 'ON') { c.waitFlow = (c.waitFlow || 0) + dt; if (c.waitFlow > 300) this.alarm('A200', 'COOLER PUMP INTERLOCK FAILURE TO CLOSE AT START-UP'); } else c.waitFlow = 0;
    // low fluid temperature (freeze protection)
    if (C2F(this.lwtSensor) < 34 && anyOn) { this.alarm('A206', 'COOLER FREEZE PROTECTION'); for (const k of this.circuits) this.stopCompressor(k, 'FREEZE', true); c.stage = 0; }

    // ---- mode transitions ----
    if (en && c.mode === 'OFF') { c.mode = 'ON'; c.smz = 0; c.lastStep = this.t - 60; }
    if (!en && (c.mode === 'ON')) {
      // transition to off: unload, stop lag, pump down lead
      c.mode = 'PUMPDOWN';
      for (const k of this.circuits) {
        if (k.state === 'PRELUBE') { k.state = 'OFF'; k.oilPump = false; k.oilSol = false; }
      }
      const runningK = this.circuits.filter(k => k.state === 'RUN' || k.state === 'STARTING');
      // lag circuit off now, lead circuit pumps down
      if (runningK.length > 1) this.stopCompressor(runningK.includes(lag_) ? lag_ : runningK[1], 'UNIT OFF');
      for (const k of this.circuits) if (k.state === 'RUN' || k.state === 'STARTING') { k.state = 'PUMPDOWN'; k.pdT = 0; k.pdStartSST = k.Tsuc; k.llsv = false; this.ev('solenoid', 'llsv' + k.id, 0.9); }
      c.stage = 0;
    }
    if (c.mode === 'PUMPDOWN' && !this.circuits.some(k => k.state !== 'OFF')) {
      c.mode = 'OFF';
      // automatic lead/lag: circuit with fewer hours leads next time
      c.lead = this.A.hours <= this.B.hours ? 'A' : 'B';
    }
    if (en && c.mode === 'PUMPDOWN') { /* finish pumpdown first, then restart */ }

    // hours
    for (const k of this.circuits) if (k.running) k.hours += dt / 3600;

    // ---- capacity algorithm (every 30 s) ----
    c.ctpt = c.setpoint;
    c.tick -= dt;
    if (c.tick <= 0) {
      c.tick += 30;
      const lwtF = C2F(this.lwtSensor), ctF = C2F(c.ctpt);
      const rateF = (lwtF - C2F(c.lastLwt)) / 0.5;              // °F per minute
      c.rate = rateF; c.lastLwt = this.lwtSensor;
      if (c.mode === 'ON') this.capacityTick(lwtF, ctF, rateF);
    }
    // high condensing temperature unloading (every 10 s)
    c.hsct = (c.hsct || 0) - dt;
    if (c.hsct <= 0) {
      c.hsct = 10;
      for (const k of this.circuits) {
        if (k.state !== 'RUN') continue;
        const sct = C2F(k.Tcond);
        if (sct > 145 + 2) {
          k.hsT = (k.hsT || 0) + 10;
          if (k.hsT >= 60 || sct > 150) {
            k.hsT = 0;
            if (k.L2) { k.L2 = false; this.ev('solenoid', 'loader' + k.id, 0.55); c.stage = Math.max(c.stage - 1, 0); }
            else if (k.L1) { k.L1 = false; this.ev('solenoid', 'loader' + k.id, 0.55); c.stage = Math.max(c.stage - 1, 0); }
            else { this.alarm(k.id === 'A' ? 'A060' : 'A061', `CIRCUIT ${k.id} HIGH SATURATED CONDENSING TEMPERATURE`); this.stopCompressor(k, 'HIGH SCT', true); }
          }
        } else k.hsT = 0;
      }
    }
    // reconcile actual circuit states with stage
    this.applyStage(dt);
    // ---- capacity display ----

// =====================================================================
//  STATIC MERGE — bake non-moving meshes into one draw call per material
// =====================================================================
function mergeStatic() {
  const animSet = new Set([
    anim.comp.A.inner, anim.comp.B.inner, anim.oilpumpA, anim.oilpumpB, anim.P1.g, anim.P2.g, anim.ahuWheel, anim.exhaust,
    anim.isoValve.g, anim.mainBreaker, anim.condFanBreaker, anim.chillerDisc, anim.hoa1, anim.eorKnob, anim.estopTog,
    anim.clock.hh, anim.clock.mh, anim.clock.sh, anim.ballValveA, anim.ballValveB, anim.ahuValveActuator,
    ...Object.values(anim.gauges).map(g => g.pivot), anim.manifold.lo.pivot, anim.manifold.hi.pivot,
  ]);
  const clickSet = new Set(clickables);
  const isAnimated = o => { while (o) { if (animSet.has(o)) return true; o = o.parent; } return false; };
  scene.updateMatrixWorld(true);
  const groups = new Map();
  scene.traverse(o => {
    if (!o.isMesh || clickSet.has(o) || isAnimated(o) || Array.isArray(o.material)) return;
    if (!groups.has(o.material)) groups.set(o.material, []);
    groups.get(o.material).push(o);
  });
  let removed = 0;
  for (const [mat, arr] of groups) {
    if (arr.length < 2) continue;
    const geos = [];
    for (const m of arr) {
      let g = m.geometry.index ? m.geometry.toNonIndexed() : m.geometry.clone();
      for (const k of Object.keys(g.attributes)) if (!['position', 'normal', 'uv'].includes(k)) g.deleteAttribute(k);
      if (!g.attributes.uv) g.setAttribute('uv', new THREE.Float32BufferAttribute(new Float32Array(g.attributes.position.count * 2), 2));
      if (!g.attributes.normal) g.computeVertexNormals();
      g.applyMatrix4(m.matrixWorld);
      geos.push(g);
    }
    const merged = mergeGeometries(geos, false);
    if (!merged) continue;
    const mesh = new THREE.Mesh(merged, mat); mesh.matrixAutoUpdate = false; scene.add(mesh);
    for (const m of arr) { m.parent.remove(m); m.geometry.dispose(); removed++; }
  }
  return removed;
}

// =====================================================================
//  AUDIO — all sound is synthesised from the simulation state
// =====================================================================
class PlantAudio {
  constructor() { this.ctx = null; this.ready = false; this.src = {}; }
  start() {
    if (this.ready) { if (this.ctx.state !== 'running') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    const ctx = this.ctx = new AC();
    this.master = ctx.createGain(); this.master.gain.value = 0.9;
    const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4; comp.attack.value = 0.005; comp.release.value = 0.2;
    this.master.connect(comp); comp.connect(ctx.destination);
    // white & pink noise buffers
    const len = ctx.sampleRate * 3;
    this.white = ctx.createBuffer(1, len, ctx.sampleRate);
    const w = this.white.getChannelData(0); for (let i = 0; i < len; i++) w[i] = Math.random() * 2 - 1;
    this.pink = ctx.createBuffer(1, len, ctx.sampleRate);
    const p = this.pink.getChannelData(0); let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0;
    for (let i = 0; i < len; i++) { const x = Math.random() * 2 - 1; b0 = 0.99886 * b0 + x * 0.0555179; b1 = 0.99332 * b1 + x * 0.0750759; b2 = 0.969 * b2 + x * 0.153852; b3 = 0.8665 * b3 + x * 0.3104856; b4 = 0.55 * b4 + x * 0.5329522; b5 = -0.7616 * b5 - x * 0.016898; p[i] = (b0 + b1 + b2 + b3 + b4 + b5 + x * 0.5362) * 0.11; }
    this.build();
    this.ready = true;
  }
  panner(pos) {
    const pn = this.ctx.createPanner();
    pn.panningModel = 'HRTF'; pn.distanceModel = 'inverse'; pn.refDistance = 1.6; pn.rolloffFactor = 1.1; pn.maxDistance = 60;
    pn.positionX.value = pos.x; pn.positionY.value = pos.y; pn.positionZ.value = pos.z;
    pn.connect(this.master); return pn;
  }
  noise(pink = false) { const s = this.ctx.createBufferSource(); s.buffer = pink ? this.pink : this.white; s.loop = true; s.loopStart = Math.random(); s.start(0, Math.random() * 2); return s; }
  filt(type, f, q = 0.7) { const b = this.ctx.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; return b; }
  gain(v = 0) { const g = this.ctx.createGain(); g.gain.value = v; return g; }
  osc(type, f) { const o = this.ctx.createOscillator(); o.type = type; o.frequency.value = f; o.start(); return o; }
  chain(...n) { for (let i = 0; i < n.length - 1; i++) n[i].connect(n[i + 1]); return n[n.length - 1]; }
  set(param, v, tc = 0.04) { if (!isFinite(v)) v = 0; param.setTargetAtTime(v, this.ctx.currentTime, tc); }

  build() {
    const P = this.positions;
    // ---- screw compressors ----
    for (const id of ['A', 'B']) {
      const out = this.panner(P['comp' + id]);
      const n = this.noise(true), nw = this.noise(false);
      const s = {
        low: this.gain(), mid: this.gain(), hi: this.gain(), pulse: this.gain(), pulse2: this.gain(), hum: this.gain(), hum3: this.gain(), rot: this.gain(), am: this.gain(1),
      };
      this.chain(n, this.filt('bandpass', 380, 0.6), s.low, s.am);
      this.chain(nw, this.filt('bandpass', 1450, 0.9), s.mid, s.am);
      this.chain(nw, this.filt('highpass', 3600, 0.5), s.hi, s.am);
      s.am.connect(out);
      s.lobe = this.osc('sawtooth', 236); this.chain(s.lobe, this.filt('lowpass', 1600, 0.9), s.pulse, out);
      s.lobe2 = this.osc('triangle', 472); this.chain(s.lobe2, s.pulse2, out);
      s.h120 = this.osc('sine', 120); this.chain(s.h120, s.hum, out);
      s.h360 = this.osc('sine', 360); this.chain(s.h360, s.hum3, out);
      s.r = this.osc('sine', 59); this.chain(s.r, s.rot, out);
      // gas pulsation amplitude modulation (flutter at lobe frequency / 4)
      s.lfo = this.osc('sine', 14); s.lfoG = this.gain(0); s.lfo.connect(s.lfoG); s.lfoG.connect(s.am.gain);
      this.src['comp' + id] = s;
    }
    // ---- primary pump (across the line) ----
    {
      const out = this.panner(P.P1);
      const s = { flow: this.gain(), vane: this.gain(), hum: this.gain(), fan: this.gain() };
      this.chain(this.noise(true), this.filt('lowpass', 650, 0.7), s.flow, out);
      s.v = this.osc('triangle', 175); this.chain(s.v, s.vane, out);
      s.h = this.osc('sine', 120); this.chain(s.h, s.hum, out);
      this.chain(this.noise(false), this.filt('bandpass', 1100, 0.8), s.fan, out);
      this.src.P1 = s;
    }
    // ---- secondary pump on VFD (motor magnetic whine tracks output frequency) ----
    {
      const out = this.panner(P.P2);
      const s = { flow: this.gain(), vane: this.gain(), fan: this.gain(), mag2: this.gain(), mag12: this.gain(), mag24: this.gain(), carrier: this.gain(), carAM: this.gain(0.5) };
      this.chain(this.noise(true), this.filt('lowpass', 700, 0.7), s.flow, out);
      s.v = this.osc('triangle', 175); this.chain(s.v, s.vane, out);
      this.chain(this.noise(false), this.filt('bandpass', 1100, 0.8), s.fan, out);
      s.m2 = this.osc('sine', 120); this.chain(s.m2, s.mag2, out);
      s.m12 = this.osc('sawtooth', 600); this.chain(s.m12, this.filt('bandpass', 900, 1.2), s.mag12, out);
      s.m24 = this.osc('sine', 1200); this.chain(s.m24, s.mag24, out);
      // PWM carrier tone radiated by the motor, amplitude-modulated at 2×f_out
      s.car = this.osc('sine', 3000); s.car.connect(s.carAM); s.carAM.connect(s.carrier); s.carrier.connect(out);
      s.carLfo = this.osc('sine', 120); s.carLfoG = this.gain(0.45); s.carLfo.connect(s.carLfoG); s.carLfoG.connect(s.carAM.gain);
      this.src.P2 = s;
      // the drive itself: heatsink fan + inductor whine
      const vout = this.panner(P.VFD);
      const d = { fan: this.gain(), whine: this.gain() };
      this.chain(this.noise(false), this.filt('bandpass', 2400, 0.7), d.fan, vout);
      d.w = this.osc('sine', 3000); this.chain(d.w, d.whine, vout);
      this.src.VFD = d;
    }
    // ---- oil pumps ----
    for (const id of ['A', 'B']) {
      const out = this.panner(P['oilpump' + id]);
      const s = { g: this.gain() };
      s.o = this.osc('sawtooth', 58); this.chain(s.o, this.filt('lowpass', 900, 1), s.g, out);
      s.w = this.osc('sine', 870); s.wg = this.gain(); this.chain(s.w, s.wg, out);
      this.src['oil' + id] = s;
    }
    // ---- AHU, exhaust fan, transformer, room tone ----
    {
      const out = this.panner(P.AHU);
      const s = { rumble: this.gain(), air: this.gain(), bpf: this.gain() };
      this.chain(this.noise(true), this.filt('lowpass', 260, 0.8), s.rumble, out);
      this.chain(this.noise(false), this.filt('bandpass', 700, 0.5), s.air, out);
      s.b = this.osc('sine', 46); this.chain(s.b, s.bpf, out);
      this.src.AHU = s;
      const eo = this.panner(P.EF); const e = { g: this.gain() }; this.chain(this.noise(true), this.filt('bandpass', 420, 0.6), e.g, eo); this.src.EF = e;
      const to = this.panner(P.T1); const t = { g: this.gain(), g2: this.gain() };
      t.o = this.osc('sine', 120); this.chain(t.o, t.g, to); t.o2 = this.osc('sine', 240); this.chain(t.o2, t.g2, to); this.src.T1 = t;
      const room = this.gain(0.02); this.chain(this.noise(true), this.filt('lowpass', 180, 0.5), room, this.master); this.src.room = room;
      const buzz = this.gain(0); this.chain(this.osc('sawtooth', 120), this.filt('bandpass', 240, 2), buzz, this.master); this.src.buzz = buzz;
      // alarm beeper at control box
      const ao = this.panner(P.CB); const a = { g: this.gain() }; a.o = this.osc('square', 2900); this.chain(a.o, this.filt('lowpass', 5000), a.g, ao); this.src.alarm = a;
    }
  }

  update(plant, cam, ui) {
    if (!this.ready) return;
    const ctx = this.ctx, L = ctx.listener;
    const p = cam.position, f = new THREE.Vector3(0, 0, -1).applyQuaternion(cam.quaternion), u = new THREE.Vector3(0, 1, 0).applyQuaternion(cam.quaternion);
    if (L.positionX) { const t = ctx.currentTime; L.positionX.setTargetAtTime(p.x, t, 0.02); L.positionY.setTargetAtTime(p.y, t, 0.02); L.positionZ.setTargetAtTime(p.z, t, 0.02); L.forwardX.setTargetAtTime(f.x, t, 0.02); L.forwardY.setTargetAtTime(f.y, t, 0.02); L.forwardZ.setTargetAtTime(f.z, t, 0.02); L.upX.setTargetAtTime(u.x, t, 0.02); L.upY.setTargetAtTime(u.y, t, 0.02); L.upZ.setTargetAtTime(u.z, t, 0.02); }
    else { L.setPosition(p.x, p.y, p.z); L.setOrientation(f.x, f.y, f.z, u.x, u.y, u.z); }
    const V = plant.elec.V;
    // compressors
    for (const c of plant.circuits) {
      const s = this.src['comp' + c.id], n = c.noise;
      const wr = c.motor.w / c.w0;
      this.set(s.low.gain, 0.55 * n.roar);
      this.set(s.mid.gain, 0.30 * n.roar + 0.03 * n.mesh);
      this.set(s.hi.gain, 0.07 * n.roar + 0.02 * n.mesh);
      this.set(s.pulse.gain, 0.10 * n.pulse);
      this.set(s.pulse2.gain, 0.05 * n.pulse + 0.02 * n.mesh);
      this.set(s.hum.gain, 0.10 * n.hum);
      this.set(s.hum3.gain, 0.035 * n.hum);
      this.set(s.rot.gain, 0.08 * wr * wr);
      this.set(s.lfoG.gain, 0.18 * Math.min(1, n.pulse));
      const lob = Math.max(n.lobeHz || 1, 1);
      this.set(s.lobe.frequency, lob, 0.02); this.set(s.lobe2.frequency, lob * 2, 0.02);
      this.set(s.r.frequency, Math.max(n.rotHz || 1, 1), 0.02);
      this.set(s.lfo.frequency, Math.max(lob / 17, 0.5), 0.05);
      this.set(s.h120.frequency, 120 * Math.max(V, 0.5)); // magnetostriction tracks supply
    }
    // primary pump
    {
      const m = plant.P1.motor, n = m.w / (m.wSync * 0.975), s = this.src.P1;
      this.set(s.flow.gain, 0.10 * n * n);
      this.set(s.vane.gain, 0.025 * n * n); this.set(s.v.frequency, Math.max(6 * m.rpm / 60, 1));
      this.set(s.hum.gain, m.conn === 'delta' ? 0.05 * V : 0);
      this.set(s.fan.gain, 0.05 * n * n);
    }
    // secondary pump + VFD
    {
      const m = plant.P2.motor, hz = plant.P2.hz, n = m.w / (m.wSync * 0.98), s = this.src.P2, d = this.src.VFD;
      const load = Math.min(1, m.I / m.ratedA);
      this.set(s.flow.gain, 0.10 * n * n);
      this.set(s.vane.gain, 0.022 * n * n); this.set(s.v.frequency, Math.max(6 * m.rpm / 60, 1));
      this.set(s.fan.gain, 0.05 * n * n);
      const on = hz > 0.3 ? 1 : 0;
      this.set(s.mag2.gain, on * (0.03 + 0.03 * load)); this.set(s.m2.frequency, Math.max(2 * hz, 1));
      this.set(s.mag12.gain, on * (0.035 + 0.02 * (1 - hz / 60))); this.set(s.m12.frequency, Math.max(12 * hz, 1));
      this.set(s.mag24.gain, on * 0.018); this.set(s.m24.frequency, Math.max(24 * hz, 1));
      this.set(s.carrier.gain, on * 0.022); this.set(s.carLfo.frequency, Math.max(2 * hz, 1));
      this.set(d.fan.gain, plant.vfd.running || hz > 0 ? 0.035 : 0);
      this.set(d.whine.gain, on * 0.008);
    }
    for (const c of plant.circuits) { const s = this.src['oil' + c.id]; this.set(s.g.gain, c.oilPump && V > 0.5 ? 0.04 : 0); this.set(s.wg.gain, c.oilPump && V > 0.5 ? 0.012 : 0); }
    { const s = this.src.AHU, a = plant.ahuSpd; this.set(s.rumble.gain, 0.16 * a * a); this.set(s.air.gain, 0.06 * a * a); this.set(s.bpf.gain, 0.03 * a); this.set(s.b.frequency, Math.max(46 * a, 1)); }
    this.set(this.src.EF.g.gain, ui.exhaustSpd * 0.05);
    this.set(this.src.T1.g.gain, plant.mainBreaker ? 0.03 + plant.elec.I / 1500 * 0.03 : 0); this.set(this.src.T1.g2.gain, plant.mainBreaker ? 0.012 : 0);
    this.set(this.src.buzz.gain, ui.lightsOn && plant.mainBreaker ? 0.004 : 0);
    const alarmOn = plant.ctl.alarms.length > 0 && plant.ctlPowered && (Math.floor(ctx.currentTime * 2) % 2 === 0);
    this.set(this.src.alarm.g.gain, alarmOn ? 0.012 : 0, 0.005);
  }

  // ---------- one-shot mechanical sounds ----------
  oneShot(type, pos, gain = 1) {
    if (!this.ready) return;
    const ctx = this.ctx, t = ctx.currentTime;
    const out = this.ctx.createPanner(); out.panningModel = 'HRTF'; out.distanceModel = 'inverse'; out.refDistance = 1.2; out.rolloffFactor = 1.1;
    out.positionX.value = pos.x; out.positionY.value = pos.y; out.positionZ.value = pos.z; out.connect(this.master);
    const burst = (dur, filterType, f, q, amp, delay = 0) => {
      const s = ctx.createBufferSource(); s.buffer = this.white; const fl = this.filt(filterType, f, q); const g = this.gain(0);
      s.connect(fl); fl.connect(g); g.connect(out);
      g.gain.setValueAtTime(0, t + delay); g.gain.linearRampToValueAtTime(amp, t + delay + 0.002); g.gain.exponentialRampToValueAtTime(0.0001, t + delay + dur);
      s.start(t + delay, Math.random()); s.stop(t + delay + dur + 0.05);
    };
    const tone = (f0, f1, dur, amp, type = 'sine', delay = 0) => {
      const o = ctx.createOscillator(); o.type = type; const g = this.gain(0); o.connect(g); g.connect(out);
      o.frequency.setValueAtTime(f0, t + delay); o.frequency.exponentialRampToValueAtTime(f1, t + delay + dur);
      g.gain.setValueAtTime(0, t + delay); g.gain.linearRampToValueAtTime(amp, t + delay + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t + delay + dur);
      o.start(t + delay); o.stop(t + delay + dur + 0.05);
    };
    switch (type) {
      case 'contactor':   // big 3-pole contactor slam
        burst(0.09, 'lowpass', 2600, 0.7, 0.55 * gain); tone(140, 70, 0.12, 0.35 * gain); burst(0.03, 'highpass', 3000, 0.7, 0.2 * gain, 0.012); break;
      case 'thud':        // across-the-line pump start: contactor + shaft torque kick through the base
        burst(0.08, 'lowpass', 2200, 0.7, 0.4 * gain); tone(65, 32, 0.38, 0.75 * gain); tone(110, 60, 0.18, 0.25 * gain); break;
      case 'solenoid':    // solenoid valve / loader coil click
        burst(0.014, 'highpass', 1500, 0.7, 0.35 * gain); tone(2200, 1700, 0.04, 0.08 * gain, 'triangle'); burst(0.05, 'bandpass', 600, 2, 0.08 * gain, 0.004); break;
      case 'relay':
        burst(0.008, 'highpass', 2500, 0.7, 0.18 * gain); break;
      case 'switch':
        burst(0.02, 'bandpass', 1800, 1.2, 0.3 * gain); tone(900, 600, 0.03, 0.06 * gain, 'triangle'); break;
      case 'breaker':
        burst(0.06, 'lowpass', 3000, 0.6, 0.6 * gain); tone(220, 90, 0.1, 0.3 * gain); break;
      case 'key':
        burst(0.01, 'bandpass', 2500, 1, 0.15 * gain); break;
      case 'alarm': break;
    }
  }
}

audio.positions = {
  compA: W(CH.x - 1.05, 1.95, CH.z), compB: W(CH.x + 1.05, 1.95, CH.z),
  P1: W(-7.3, 0.6, CH.z - 0.2), P2: W(-7.3, 0.6, CH.z + 4.4), VFD: W(-11.8, 1.6, CH.z + 4.4),
  oilpumpA: W(CH.x - 1.25, 0.35, CH.z + 0.55), oilpumpB: W(CH.x + 1.25, 0.35, CH.z + 0.55),
  AHU: W(7.6, 1.3, 5.5), EF: W(11.9, 4.4, 4.5), T1: W(11.2, 0.7, -1.6), CB: W(CH.x + 2.9, 1.4, CH.z),

const evPos = (src) => {
  const P = audio.positions;
  if (src.startsWith('compS') || src.startsWith('comp')) return P.CB;          // contactors live in the control box
  if (src.startsWith('loader') || src.startsWith('mc') || src.startsWith('oil') && !src.startsWith('oilpump')) return src.endsWith('A') ? P.compA : P.compB;
  if (src.startsWith('oilpump')) return P['oilpump' + src.slice(-1)];
  if (src.startsWith('llsv')) return W(CH.x + (src.endsWith('A') ? -1.25 : 1.25), 1.45, CH.z - 1.05);
  if (src === 'P1') return W(-11.8, 1.45, CH.z - 0.2);
  if (src === 'bas') return W(-3.4, 1.55, 7.85);
  if (src === 'flowswitch') return W(CH.x - 2.4, 1.1, CH.z - 0.2);

};

// ---------------- unit display module (4 × 20 LCD) ----------------
const f1 = v => (Math.round(v * 10) / 10).toFixed(1);
const pad = (a, b, n = 20) => { a = String(a); b = String(b); return (a + ' '.repeat(Math.max(1, n - a.length - b.length)) + b).slice(0, n); };
const unitModeText = () => {
  const c = plant.ctl;
  if (!plant.ctlPowered) return '';
  if (plant.ctlBoot > 0) return 'INITIALIZING...';
  if (!c.estop) return 'EMERGENCY STOP';
  const on = plant.unitEnabled();
  if (c.mode === 'PUMPDOWN') return 'PUMPDOWN';
  if (c.alarms.length && !on) return 'ALARM';
  return on ? 'LOCAL ON' : 'LOCAL OFF';
};
const navPages = () => {
  const p = plant, A = p.A, B = p.B, c = p.ctl;
  const cir = k => [
    [`CIRCUIT ${k.id}`, k.compOn ? (k.state === 'PUMPDOWN' ? 'PMPDN' : 'RUN') : 'OFF'],
    [`DP.${k.id} DISCH`, `${f1(kPa2psig(k.Pcond))} PSIG`],
    [`SP.${k.id} SUCT`, `${f1(kPa2psig(k.Psuc))} PSIG`],
    [`SCT.${k.id}`, `${f1(C2F(k.Tcond))} °F`],
  ];
  const cir2 = k => [
    [`SST.${k.id}`, `${f1(C2F(k.Tsuc))} °F`],
    [`DGT.${k.id}1 DIS GAS`, `${f1(C2F(k.Tdgt))} °F`],
    [`DSH.${k.id} DIS SH`, `${f1(k.DSHmeas * 1.8)} ^F`],
    [`EXV.${k.id}`, `${f1(k.exv * 100)} %`],
  ];
  const cir3 = k => [
    [`CC.${k.id}1 COMP`, k.compOn ? 'ON' : 'OFF'],
    [`LD.${k.id}1 / LD.${k.id}2`, `${k.L1 ? 'ON' : 'OFF'}/${k.L2 ? 'ON' : 'OFF'}`],
    [`OP.${k.id} OIL PUMP`, k.oilPump ? 'ON' : 'OFF'],
    [`MTR.${k.id}1 MOTOR`, `${f1(C2F(k.Tmotor))} °F`],
  ];
  const al = c.alarms.length ? c.alarms.slice(0, 3).map(a => [a.code, a.text.slice(0, 14)]) : [['NO ACTIVE ALARMS', '']];
  while (al.length < 3) al.push(['', '']);
  return [
    [['RUN STATUS', unitModeText()], ['EWT', `${f1(C2F(p.ewtSensor))} °F`], ['LWT', `${f1(C2F(p.lwtSensor))} °F`], ['SETP', `${f1(C2F(c.setpoint))} °F`]],
    [['CAP TOTAL', `${c.capacityPct} %`], ['STGE', `${c.stage}`], ['SMZ LOAD/UNLD', `${Math.round(c.smz)} %`], ['LEAD CIRCUIT', c.lead]],
    cir(A), cir2(A), cir3(A), cir(B), cir2(B), cir3(B),
    [['HRS.A / HRS.B', `${Math.round(A.hours)}/${Math.round(B.hours)}`], ['ST.A / ST.B', `${A.starts}/${B.starts}`], ['OAT', `${f1(p.oatF)} °F`], ['CHWS FLOW SW', p.flowSwitch ? 'CLOSED' : 'OPEN']],
    [['ALARMS', `${c.alarms.length} ACTIVE`], ...al],
    [['ALARM RESET', ''], ['RCRN: PRESS ENTER', ''], ['TO RESET ALL', ''], ['CURRENT ALARMS', '']],
  ];
};
function navKey(k) {
  const n = navPages().length;
  if (k === 'ESC') { ui.navPage = -1; ui.navExpand = false; }
  if (k === 'DOWN') ui.navPage = (ui.navPage + 1 + n) % n;
  if (k === 'UP') ui.navPage = ui.navPage <= 0 ? n - 1 : ui.navPage - 1;
  if (k === 'ENTER' && ui.navPage === n - 1) { plant.resetAlarms(); ui.navFlash = 2; }
  ui.navT = 0;
}
function drawNav() {
  const S = anim.screens.nav, g = S.g;
  const powered = plant.ctlPowered;
  g.fillStyle = powered ? '#8fbf3a' : '#2b3a19'; g.fillRect(0, 0, S.w, S.h);
  if (powered) {
    g.fillStyle = 'rgba(0,0,0,0.06)'; for (let i = 0; i < 20; i++) g.fillRect(8 + i * 19.2, 6, 17.5, 148);
    g.fillStyle = '#16200a'; g.font = 'bold 30px "Courier New", monospace'; g.textBaseline = 'top';
    let lines;
    if (plant.ctlBoot > 0) lines = ['', '  INITIALIZING', `  WAIT ${Math.ceil(plant.ctlBoot)} s`, ''];
    else if (ui.navFlash > 0) lines = ['ALARMS RESET', '', '', ''];
    else if (ui.navPage < 0) {
      // default rotating display (VIEW sub-mode)
      const t = new Date(0); t.setUTCSeconds(plant.clock);
      const hh = String(t.getUTCHours()).padStart(2, '0'), mm = String(t.getUTCMinutes()).padStart(2, '0');
      const items = [['EWT', `${f1(C2F(plant.ewtSensor))} °F`], ['LWT', `${f1(C2F(plant.lwtSensor))} °F`], ['SETP', `${f1(C2F(plant.ctl.setpoint))} °F`], ['CAP', `${plant.ctl.capacityPct} %`], ['STGE', `${plant.ctl.stage}`], ['ALRM', `${plant.ctl.alarms.length}`]];
      const k = Math.floor(ui.navRot) % 2;
      lines = [pad(unitModeText(), `${hh}:${mm}`), ...items.slice(k * 3, k * 3 + 3).map(([a, b]) => pad(a, b))];
    } else lines = navPages()[ui.navPage].map(([a, b]) => pad(a, b));
    lines.forEach((ln, i) => g.fillText(ln.padEnd(20).slice(0, 20), 10, 8 + i * 37));
  }
  S.tex.needsUpdate = true;
}

  // AHU fan wheel + exhaust fan
  anim.ahuWheel.rotation.z += p.ahuSpd * 9 * dt;
  ui.exhaustSpd = lerp(ui.exhaustSpd, p.mainBreaker && p.bas.occ && p.basPowered ? 1 : 0, 1 - Math.exp(-dt / 4));
  anim.exhaust.rotation.z += ui.exhaustSpd * 14 * dt;
  anim.ahuValveActuator.position.y = 1.33 + p.valve * 0.08;
  // isolation valve handwheel & indicator
  anim.isoValve.ind.rotation.y = (1 - p.isoValve) * Math.PI / 2;
  anim.isoValve.wheel.rotation.x = (1 - p.isoValve) * 14;
  // gauges
  const n1 = p.P1.motor.w / (p.P1.motor.wSync * 0.975), n2 = p.P2.motor.w / (p.P2.motor.wSync * 0.98);
  const stat = 28;
  const h1 = 17.5 * n1 * n1 * 1.42, h2 = 26 * n2 * n2 * 1.42;
  const evDrop = 6.5 * (p.Fp / (600 * GPM)) ** 2;
  const G = anim.gauges;
  G.p1s.set(stat - 1.5 * (p.Fp / (600 * GPM)) ** 2, dt); G.p1d.set(stat + h1 * clamp(0.7 + 0.3 * p.isoValve, 0, 1.1), dt);
  G.evIn_p.set(stat + h1 * 0.85 * (p.isoValve > 0.05 ? 1 : 0), dt); G.evOut_p.set(stat + h1 * 0.85 * (p.isoValve > 0.05 ? 1 : 0) - evDrop, dt);
  G.evIn_t.set(C2F(p.Tevap_in ?? p.Tret), dt); G.evOut_t.set(C2F((p.cooler.A.Tw + p.cooler.B.Tw) / 2), dt);
  G.p2s.set(stat + 1, dt); G.p2d.set(stat + 1 + h2, dt);
  G.mag.set(0.12 + 0.55 * p.ahuSpd * p.ahuSpd, dt);
  anim.manifold.lo.set(kPa2psig(p.A.Psuc), dt); anim.manifold.hi.set(kPa2psig(p.A.Pcond), dt);
  // pilot lights
  anim.p1RunLight.material.color.set(p.P1.contactor && p.mainBreaker ? 0x3dff5a : 0x1a3a1a);
  anim.flowLed.material.color.set(!p.mainBreaker ? 0x111100 : p.flowSwitch ? 0xffd21a : p.Fp > 5 ? 0x887a10 : 0x1a8a1a);
  const blink = Math.floor(now * 2) % 2 === 0;
  anim.alarmLight.material.color.set(p.ctl.alarms.length && p.ctlPowered && blink ? 0xff2a1a : 0x3a0e0e);
  anim.powerLight.material.color.set(p.ctlPowered ? 0x3dff5a : 0x113311);
  // wall clock
  const h = (p.clock / 3600) % 12, m = (p.clock / 60) % 60, s = p.clock % 60;
  anim.clock.hh.rotation.z = -h / 12 * Math.PI * 2; anim.clock.mh.rotation.z = -m / 60 * Math.PI * 2; anim.clock.sh.rotation.z = -Math.floor(s) / 60 * Math.PI * 2;
}

// ---------------- main loop ----------------
let last = performance.now(), simAcc = 0;
ui.minV = 1; ui.minVT = 0;
mergeStatic();
setKnob();
drawBAS(); drawNav(); drawVFD(); drawMeter(); drawLeak();
function frame() {
  const now = performance.now();
  let dt = Math.min((now - last) / 1000, 0.1); last = now;
  // simulation: fixed 10 ms steps
  simAcc += dt * ui.speed;
  const h = 0.01; let steps = 0;
  while (simAcc >= h && steps < 4000) {
    plant.step(h); simAcc -= h; steps++;
    ui.minV = Math.min(ui.minV, plant.elec.V);
    if (plant.events.length) {
      for (const ev of plant.events) audio.oneShot(ev.type, evPos(ev.src), ev.gain);
      plant.events.length = 0;
    }
  }
  ui.minVT += dt; if (ui.minVT > 10) { ui.minVT = 0; ui.minV = plant.elec.V; }
  // trend sampling (every 5 s sim)
  if (plant.clock - ui.trendT >= 5) {
    ui.trendT = plant.clock;
    ui.trend.push({ t: plant.clock, lwt: C2F(plant.lwtSensor), ewt: C2F(plant.ewtSensor), sp: C2F(plant.ctl.setpoint), cap: plant.ctl.capacityPct, sstA: C2F(plant.A.Tsuc) });
    if (ui.trend.length > 800) ui.trend.shift();
  }
  updatePlayer(dt);
  updateVisuals(dt, now / 1000);
  audio.update(plant, camera, ui);
  ui.navT += dt; ui.navRot += dt / 3; if (ui.navFlash > 0) ui.navFlash -= dt;
  if (ui.navT > 60 && ui.navPage >= 0) { ui.navPage = -1; }
  ui.screenT += dt;
  if (ui.screenT > 0.2) { ui.screenT = 0; drawNav(); drawBAS(); drawVFD(); drawMeter(); drawLeak(); }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__plant = plant; window.__ui = ui; window.__player = player; window.__scene = scene; window.__renderer = renderer; window.__anim = anim; window.__camera = camera; window.__RC = THREE.Raycaster;

</script>
