<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
// =====================================================================
//  PLANT SIMULATION — 250-ton split screw chiller, Trane RTUD-pattern
//  (compressor-chiller indoors + 14-fan remote air-cooled condenser),
//  Tracer CH530-pattern controls. Pure JS, no DOM.
//  Internal units SI: °C, kPa(abs), kg, kg/s, kW, s.
// =====================================================================
// ---- R-134a saturation correlations (least-squares fit to NIST data, -20..70 °C) ----
const R134a = {
  psat: T => Math.exp(14.65060697 - 2221.99761539 / (T + 247.64172105)),           // kPa abs
  tsat: P => 2221.99761539 / (14.65060697 - Math.log(Math.max(P, 1))) - 247.64172105,
  rhog: T => Math.exp(-7.14598e-5 * T * T + 0.0346726566 * T + 2.65427177),        // kg/m³ sat. vapor
  rhol: T => -0.0145833 * T * T - 3.22295454 * T + 1296.8197,                      // kg/m³ sat. liquid
  hfg:  T => -0.0045113636 * T * T - 0.7387348485 * T + 199.1998485,               // kJ/kg
  hl:   T => 0.0021742424 * T * T + 1.3352272727 * T + 199.7566667,                // kJ/kg
  cpv: 1.02, cpl: 1.40, k: 1.12,
};
const CPW = 4.186;                 // water kJ/kg·K
const GPM = 0.06309;               // kg/s per US gpm (water)
const C2F = c => c * 1.8 + 32;
const F2C = f => (f - 32) / 1.8;
const dC2dF = d => d * 1.8;
const kPa2psig = p => p * 0.1450377 - 14.696;
const psig2kPa = g => (g + 14.696) / 0.1450377;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const approach = (v, target, rate, dt) => {
  const d = target - v, m = rate * dt;
  return Math.abs(d) <= m ? target : v + Math.sign(d) * m;
};
const lag = (v, target, tau, dt) => v + (target - v) * (1 - Math.exp(-dt / Math.max(tau, 1e-6)));

// ---------------------------------------------------------------------
//  Squirrel-cage induction motor — equivalent-circuit torque/current
//  per-unit: i(s) = 1/sqrt((r/s)^2 + x^2) ; t(s) = i^2 r / s
//  Wye connection: line current & torque are 1/3 of delta values.
// ---------------------------------------------------------------------
class InductionMotor {
  constructor({ name, poles = 2, ratedKW, ratedA, lra = 6, sRated = 0.012, J, mag = 0.32 }) {
    this.name = name;
    this.wSync = 2 * Math.PI * 60 / (poles / 2);
    this.ratedKW = ratedKW; this.ratedA = ratedA;
    this.Trated = ratedKW * 1000 / (this.wSync * (1 - sRated));
    this.x = 1 / lra;
    const a = (1 + Math.sqrt(1 - 4 * this.x * this.x)) / 2;  // r/s at rated point gives t = 1
    this.r = a * sRated;
    this.J = J; this.mag = mag;
    this.w = 0; this.conn = 'off';           // off | wye | delta | gap
    this.freq = 60;                          // supply frequency (VFD-fed motors change it)
    this.voltScale = 1;                      // V/Hz for VFD
    this.transient = 0;                      // reclosing transient multiplier
    this.inrush = 0;                         // additive inrush, pu of rated current
    this.I = 0; this.T = 0; this.Pelec = 0; this.slip = 1;
  }
  get rpm() { return this.w * 60 / (2 * Math.PI); }
  torque(w, Vpu) {                                 // returns [Te (N·m), Ipu]
    const wS = this.wSync * this.freq / 60;
    if (!(this.conn === 'wye' || this.conn === 'delta')) return [0, 0, 1];
    const kv = this.conn === 'wye' ? 1 / 3 : 1;
    const s = wS > 1 ? clamp((wS - w) / wS, -0.2, 1) : 1;
    const ss = Math.abs(s) < 1e-5 ? 1e-5 * Math.sign(s || 1) : s;
    const fpu = Math.max(this.freq / 60, 0.05);       // V/Hz: reactance scales with frequency
    const x = this.x * fpu;
    const rr = this.r * (1 + 3.5 * Math.min(Math.abs(ss), 1));   // deep-bar rotor
    const i = 1 / Math.sqrt((rr / ss) ** 2 + x * x);
    const v = Vpu * this.voltScale;
    const t = (i * i * rr / ss) / fpu;
    return [kv * v * v * t * this.Trated, Math.hypot(kv * v * i, kv * v * this.mag), s];
  }
  step(dt, Tload, Vpu) {
    let [Te, Ipu, s] = this.torque(this.w, Vpu);
    this.slip = s;
    if (Ipu > 0) { Ipu *= 1 + this.transient; this.transient *= Math.exp(-dt / 0.12); Ipu += this.inrush; }
    this.inrush *= Math.exp(-dt / 0.14);                 // winding re-connection magnetising inrush (decays in a few cycles)
    // semi-implicit Euler: the torque–speed curve is very stiff near synchronous speed
    const dw = 0.5;
    const slope = Ipu > 0 ? Math.max(0, (Te - this.torque(this.w + dw, Vpu)[0]) / dw) : 0;
    const Tl = this.w > 0.5 ? Tload : Math.min(Tload, Te) * 0.98;
    this.w = Math.max(0, this.w + dt * (Te - Tl) / (this.J + dt * slope));
    this.T = Te; this.I = Ipu * this.ratedA;
    this.Pelec = this.conn === 'off' || this.conn === 'gap' ? 0 : Math.max(0, Te * this.w / 1000 / 0.94) + 0.02 * this.ratedKW * (Ipu > 0 ? 1 : 0);
  }
}


// ---------------------------------------------------------------------
//  One refrigerant circuit of an RTUD-pattern compressor-chiller:
//  helical-rotary compressor (5-lobe male / 7-lobe female rotors,
//  suction-gas-cooled 2-pole motor, closed-transition wye-delta starter),
//  female-step load solenoid + modulating slide valve, oil separator,
//  liquid-level-controlled EXV feeding a falling-film/flooded evaporator,
//  and 7 fixed-speed fans of the remote air-cooled condenser (roof).
// ---------------------------------------------------------------------
class Circuit {
  constructor(id, sim) {
    this.id = id; this.sim = sim;
    this.name = id === 'A' ? '1A' : '2A';                // Trane naming: Compressor 1A / 2A
    // --- compressor ---
    this.Vd = 0.205;                                     // m³/s swept at 3575 rpm (~125 tons R-134a)
    this.motor = new InductionMotor({ name: 'comp' + id, poles: 2, ratedKW: 160, ratedA: 225, lra: 6.0, sRated: 0.0068, J: 0.62, mag: 0.30 });
    this.w0 = this.motor.wSync * (1 - 0.0068);
    this.sv = 0.30;                                      // actual capacity fraction (physical slide/step position)
    this.slide = 0;                                      // modulating slide valve position 0..1 (above step point)
    this.stepSol = false;                                // female-step load solenoid
    this.unloadSol = true;                               // unload solenoid (energised when stopped & at start)
    this.loadPulse = 0;                                  // +1 load pulse, -1 unload pulse, 0 hold
    this.c1M = false; this.cS = false; this.c2M = false; this.cTR = false;   // wye-delta closed-transition contactors
    this.exv = 0; this.exvTarget = 0;
    this.state = 'OFF';                                  // OFF | WAIT_OIL | PREPOS | STARTING | RUN | RUN_UNLOAD | PUMPDOWN
    this.tState = 0; this.tRun = 0;
    this.startT = -1e9; this.stopT = -1e9;
    this.hours = id === 'A' ? 21520.4 : 21518.9; this.starts = id === 'A' ? 6311 : 6296;
    this.oilHeater = true; this.oilT = 45; this.oilWait = 0;
    this.oilFill = false; this.oilDrain = false;         // oil return gas-pump fill / drain solenoids
    this.Tmotor = 30;
    this.capDes = 0;                                     // capacity requested by the chiller algorithm (0..1)
    this.forced = '';                                    // 'LOWDP' | 'HOTSTART' | 'LIMIT…'
    // --- refrigerant state ---
    this.Mtot = 145;                                     // kg charge in circuit
    this.Mliq = 30;                                      // kg liquid in evaporator
    this.MlineFill = 24;                                 // liquid line volume (kg)
    this.Tsuc = 16; this.Tcond = 26; this.Tdis = 26; this.Tdgt = 26;
    this.SC = 8; this.SSH = 0; this.DSH = 0;
    this.mComp = 0; this.mExv = 0; this.Qevap = 0; this.Qcond = 0; this.Pshaft = 0;
    this.PR = 1; this.PRint = 2; this.Vi = 2;
    this.flash = 0; this.carry = 0;
    // --- condenser fans (7 per circuit) ---
    this.fanCmd = new Array(7).fill(false);
    this.fanSpd = new Array(7).fill(0);
    this.fanStage = 0; this.fanT = 0;
    this.noise = { tone: 0, harm: 0, roar: 0, hum: 0, lobeHz: 0, rotHz: 0, femHz: 0 };
    this.exvInt = 0.3; this.alarm = null; this.lowRTt = 0;
    this.liquidValveOpen = 1;                            // liquid line service valve (fault injection)
  }

  get Psuc() { return R134a.psat(this.Tsuc); }
  get Pcond() { return R134a.psat(this.Tcond); }
  get L() { return clamp(this.Mliq / 140, 0, 1.2); }     // evaporator liquid level (fraction of design)
  get levelMM() { return Math.round((this.L - 0.45) * 160); }   // displayed relative to set point, mm
  get compOn() { return this.c1M; }
  get rla() { return this.motor.I / this.motor.ratedA * 100; }
  get running() { return this.c1M; }

  step(dt, ctx) {
    const sim = this.sim;
    const w = this.motor.w, wr = w / this.w0;
    const Ps = this.Psuc, Pd = this.Pcond;
    const dP = Math.max(Pd - Ps, 0);

    // ---- capacity mechanism (oil-pressure actuated, needs rotation + ΔP) ----
    const oilP = clamp(wr, 0, 1) * clamp((dP - 60) / 250, 0, 1);
    if (this.c1M && this.loadPulse > 0 && !this.unloadSol) this.slide = clamp(this.slide + 0.022 * oilP * dt, 0, 1);
    if (this.unloadSol || this.loadPulse < 0) this.slide = clamp(this.slide - 0.035 * Math.max(oilP, this.c1M ? 0 : 0.02) * dt, 0, 1);
    if (!this.c1M && this.unloadSol) this.slide = clamp(this.slide - 0.002 * dt, 0, 1);
    const capTarget = this.stepSol ? 0.58 + 0.42 * this.slide : 0.30 + 0.10 * this.slide;
    if (capTarget > this.sv) this.sv = approach(this.sv, capTarget, (this.stepSol ? 0.9 : 0.05) * Math.max(oilP, 0.02), dt);  // step snaps in < 1 s
    else this.sv = approach(this.sv, capTarget, (0.6 * oilP + (this.c1M ? 0 : 0.003)), dt);
    this.Vi = 2.0 + 1.3 * clamp((this.sv - 0.30) / 0.70, 0, 1);
    this.PRint = Math.pow(this.Vi, R134a.k);
    this.PR = Pd / Ps;

    // ---- evaporator level effects ----
    const L = this.L;
    this.SSH = clamp((0.35 - L) * 40, 0, 12);
    this.carry = clamp((L - 0.62) * 0.12, 0, 0.08);
    const wet = clamp(0.15 + 1.9 * L, 0.08, 1.0);

    // ---- compressor flow & work ----
    const rhoS = R134a.rhog(this.Tsuc) * (273.15 + this.Tsuc) / (273.15 + this.Tsuc + this.SSH);
    const etaV = clamp(0.965 - 0.022 * (this.PR - 1) - 0.08 * (1 - this.sv), 0.3, 0.97);
    this.mComp = rhoS * this.Vd * clamp(wr, 0, 1.05) * this.sv * etaV;
    const k = R134a.k, vS = 1 / rhoS;
    const wIs = (k / (k - 1)) * Ps * vS * (Math.pow(Math.max(this.PR, 1), (k - 1) / k) - 1);
    const mis = this.PR - this.PRint;
    const wMis = mis > 0 ? Ps * vS * mis / this.Vi : Ps * vS * (-mis) / this.Vi * 0.35;
    const etaIs = 0.84 - 0.12 * (1 - this.sv) / 0.7;
    this.Pshaft = this.mComp * (wIs / etaIs + wMis) + 4.5 * wr * wr + 1.0 * wr;
    const Tload = w > 5 ? this.Pshaft * 1000 / w : 12;
    this.motor.step(dt, Tload, sim.elec.V);

    // ---- discharge temperature ----
    const dshDry = 0.28 * Math.max(this.Tcond - this.Tsuc, 0) + 0.75 * this.SSH + 5 * (wMis / Math.max(wIs, 1)) + 2.5;
    this.DSH = this.mComp > 0.05 ? Math.max(dshDry - 500 * this.carry, -2) : 0;
    this.Tdis = this.mComp > 0.05 ? lag(this.Tdis, this.Tcond + this.DSH, 6, dt) : lag(this.Tdis, sim.roomT, 900, dt);
    this.Tdgt = lag(this.Tdgt, this.Tdis, 12, dt);

    // ---- liquid line / EXV (no field LLSV — the EXV closes the circuit off) ----
    const Mcl = this.Mtot - this.Mliq - this.MlineFill;
    this.SC = clamp((Mcl - 28) * 0.35, -12, 18);
    const Tliq = this.Tcond - Math.max(this.SC, 0);
    this.flash = clamp(-this.SC / 6, 0, 1);
    const rhoL = R134a.rhol(Tliq);
    const elev = sim.condElev;                                // condenser above evaporator, m
    const dPexv = Pd + rhoL * 9.81 * elev / 1000 - 25 - Ps;
    this.exv = approach(this.exv, this.exvTarget, 1 / 15, dt); // full stroke ≈ 15 s
    const open = this.liquidValveOpen;
    this.mExv = open * 0.0049 * this.exv * Math.sqrt(Math.max(dPexv, 0) * rhoL) / (1 + 0.35 * Math.max(-this.SC, 0));
    const hIn = R134a.hl(Tliq) + (this.SC < 0 ? -this.SC * 1.6 : 0);
    const hfgS = R134a.hfg(this.Tsuc);
    const xIn = clamp((hIn - R134a.hl(this.Tsuc)) / hfgS, 0, 1);

    // ---- evaporator (refrigerant shell side, water in tubes) ----
    const half = sim.cooler[this.id];
    const F = ctx.FpHalf;
    const UA = 80 * wet;
    let Q = F > 0.5 ? (1 - Math.exp(-UA / (F * CPW))) * F * CPW * (ctx.Tin - this.Tsuc) : 6 * wet * (half.Tw - this.Tsuc);
    if (this.mComp < 0.05 && this.mExv < 0.01) Q = 6 * (half.Tw - this.Tsuc);
    this.Qevap = Q;
    const boil = Q / hfgS;
    this.Mliq = Math.max(0, this.Mliq + (this.mExv * (1 - xIn) - boil - this.mComp * this.carry) * dt);
    const Ceff = 0.25 + (this.Mliq * R134a.cpl + 140) / hfgS;
    this.Tsuc = clamp(this.Tsuc + (this.mExv * xIn + boil - this.mComp * (1 - this.carry)) / Ceff * dt, -30, 60);

    // ---- remote air-cooled condenser ----
    const T_amb = sim.oat + 1.5;
    let UAc = 0.9;
    for (let i = 0; i < 7; i++) {
      this.fanSpd[i] = lag(this.fanSpd[i], this.fanCmd[i] && sim.condFanBreaker ? 1 : 0, this.fanCmd[i] ? 2.5 : 9, dt);
      UAc += 5.1 * this.fanSpd[i];
    }
    this.Qcond = UAc * (this.Tcond - T_amb);
    const qIn = this.mComp * (R134a.hfg(this.Tcond) + R134a.cpv * Math.max(this.DSH, 0) + R134a.cpl * Math.max(this.SC, 0));
    this.Tcond += (qIn - this.Qcond) / 820 * dt;
    if (this.Tcond < this.Tsuc && this.exv > 0.02 && open > 0) this.Tcond = lag(this.Tcond, this.Tsuc, 30, dt);

    // ---- oil sump & motor temperature ----
    this.oilT = lag(this.oilT, this.c1M ? this.Tdis - 5 : (this.oilHeater ? 46 : sim.roomT), this.c1M ? 120 : 1800, dt);
    const loss = this.motor.Pelec * 0.05 + (this.motor.I > 2 * this.motor.ratedA ? 6 : 0);
    const cool = (this.mComp * 7 + 0.25) * (this.Tmotor - this.Tsuc) / 10 + 0.05 * (this.Tmotor - sim.roomT);
    this.Tmotor += (loss - cool) / 95 * dt;

    // ---- acoustic descriptors (calibrated against the recording, see audio) ----
    // Lobe-passing tone: 5-lobe male rotor. Strength follows gas pulsation, which is dominated
    // by the internal-volume-ratio mismatch and the bypass recirculation when unloaded.
    const wr2 = wr * wr;
    const u = clamp((0.58 - this.sv) / 0.28, 0, 1);            // fully unloaded (below the step point) → 1
    const press = Math.sqrt(clamp(dP / 700, 0, 1.6));
    const puls = Math.min(1.5, Math.abs(mis) / this.PRint);
    this.noise.tone = wr2 * (0.22 + 0.80 * u * press + 0.35 * puls);
    this.noise.harm = wr2 * (0.15 + 0.85 * u * press + 0.25 * puls);  // odd-harmonic richness
    this.noise.roar = wr2 * (0.10 + 0.25 * u * press + 0.05 * this.mComp / 3);
    const v = sim.elec.V;
    this.noise.hum = this.motor.conn === 'delta' ? 0.35 * v : this.motor.conn === 'wye' ? 0.13 * v : 0;
    this.noise.rotHz = this.motor.rpm / 60;
    this.noise.lobeHz = 5 * this.noise.rotHz;
    this.noise.femHz = this.noise.rotHz * 5 / 7;
  }
}

// ---------------------------------------------------------------------
//  The whole plant
// ---------------------------------------------------------------------
class Plant {
  constructor() {
    this.t = 0;
    this.clock = 6 * 3600 + 58 * 60 + 40;               // 06:58:40
    this.events = [];
    this.oat = F2C(80); this.oatOffset = 0; this.oatManual = null;
    this.roomT = F2C(82);
    this.condElev = 6.0;                                 // condenser elevation setting: condenser 6 m above evaporator
    this.condFanBreaker = true;
    this.mainBreaker = true; this.chillerDisc = true;
    this.ctlPowered = true; this.ctlBoot = 0; this.basPowered = true; this.basBoot = 0;
    this.elec = { V: 1, Vslow: 1, I: 0, light: 1, base: 160 };

    this.A = new Circuit('A', this);
    this.B = new Circuit('B', this);
    this.circuits = [this.A, this.B];
    this.cooler = { A: { Tw: F2C(64) }, B: { Tw: F2C(64) } };
    this.lwtSensor = F2C(64); this.ewtSensor = F2C(64);

    // evaporator (primary) pump: constant speed, across-the-line, relay owned by the chiller controller
    this.P1 = { motor: new InductionMotor({ name: 'P1', poles: 4, ratedKW: 11.2, ratedA: 21, lra: 6.5, sRated: 0.01, J: 0.11, mag: 0.4 }),
                hoa: 'AUTO', cmd: false, contactor: false, vanes: 7 };
    // secondary distribution pump on VFD (BAS-controlled)
    this.P2 = { motor: new InductionMotor({ name: 'P2', poles: 4, ratedKW: 18.6, ratedA: 34, lra: 6.5, sRated: 0.02, J: 0.25, mag: 0.4 }),
                hoa: 'AUTO', run: false, hz: 0, hzCmd: 0, vanes: 6 };
    this.P2.motor.freq = 0;
    this.vfd = { accel: 60 / 20, decel: 60 / 7, minHz: 12, maxHz: 60, I: 0, kW: 0, running: false };
    this.isoValve = 1; this.isoValveCmd = 1;
    this.flowSwitch = false; this.fsT = 0;

    this.Tsup = F2C(64); this.Tret = F2C(65);
    this.Tzone = F2C(76.5);
    this.valve = 0; this.valveInt = 0;
    this.Qcoil = 0; this.Fp = 0; this.Fs = 0;
    this.ahuOn = false; this.ahuSpd = 0;

    // ---- Tracer CH530-pattern unit controller ----
    this.ctl = {
      frontPanel: 'AUTO',              // DynaView Auto / Stop
      ext: false,                      // External Auto/Stop input (closed = Auto) — wired from the BAS
      estop: true,                     // External emergency stop input (true = normal)
      setpoint: F2C(44),               // Active chilled water set point
      dts: 2 / 1.8, dtStop: 2 / 1.8,   // Differential to Start / Stop (2 °F defaults)
      softload: 120,                   // Capacity Control Softload Time, s (adjustable 0–7200, default 900)
      pumpOffDelay: 120,               // Evaporator Pump Off Delay, s (adjustable 0–30 min, default 1 min)
      restartInhibit: 300,             // 5 min start-to-start
      maxAccel: 6,                     // Maximum acceleration timer, s (forces transition)
      lrtc: F2C(28.6),                 // Low Refrigerant Temperature Cutout default
      lwtCutout: F2C(36),              // Low Evaporator Leaving Water Temperature Cutout default
      hpc: psig2kPa(300),              // High pressure cutout (gauge 300 psig, absolute here)
      mode: 'Stopped', sub: 'Local Stop', D: 0, softLim: 2, errPrev: 0, pid: 0,
      pumpRelay: false, pumpOffT: 0, stopping: false, stageT: 0, unstageT: 0,
      alarms: [], history: [], lead: 'A', capacityPct: 0, waitFlowT: 0, noFlowT: 0,
    };
    // ---- BAS (field program — inferred from observed behaviour) ----
    this.bas = { mode: 'AUTO', occ: false, seq: 'OFF', t: 0, speedCmd: 0, dpSP: 12, dp: 0, stopDelay: 60 };
  }

  get oatF() { return C2F(this.oat); }
  ev(type, src, gain = 1) { this.events.push({ type, src, gain }); }

  updateWeather() {
    const h = (this.clock / 3600) % 24;
    const base = 78 + 13 * Math.sin((h - 9) / 24 * 2 * Math.PI) * (h > 5 && h < 21 ? 1 : 0.6);
    this.oat = F2C(this.oatManual != null ? this.oatManual : base + this.oatOffset);
  }

  updateElectrical(dt) {
    const e = this.elec;
    let I = e.base + (this.ahuOn ? 38 * this.ahuSpd ** 3 : 0) + 6;
    for (const c of this.circuits) I += c.motor.I;
    I += this.P1.motor.I + this.vfd.I * 0.95;
    e.I = I;
    e.V = this.mainBreaker ? 1 - I * 0.026 / 277 : 0;
    if (!this.mainBreaker) { e.I = 0; e.Vslow = lag(e.Vslow, 1, 1, dt); e.light = 0; return; }
    e.Vslow = lag(e.Vslow, e.V, 6, dt);
    e.light = lag(e.light, Math.pow(e.V / e.Vslow, 3.2), 0.035, dt);
  }

  updateWater(dt) {
    const P1 = this.P1, P2 = this.P2, vfd = this.vfd;
    // valve operator moves slowly (gear handwheel)
    this.isoValve = approach(this.isoValve, this.isoValveCmd, 1 / 12, dt);
    const isoF = this.isoValve <= 0.02 ? 0 : Math.sqrt(this.isoValve) * (1 - 0.15 * (1 - this.isoValve));
    // primary pump hydraulics: Q ∝ speed, loads motor with ρgQH/η
    const n1 = P1.motor.w / (P1.motor.wSync * 0.975);
    const Fp_target = 600 * GPM * clamp(n1, 0, 1.05) * isoF;
    this.Fp = lag(this.Fp, Fp_target, 1.6, dt);
    const H1 = 17.5 * n1 * n1;              // m head
    const Tl1 = P1.motor.w > 1 ? (1000 * 9.81 * (this.Fp / 1000) * H1 / 0.70) / P1.motor.w + 2 * n1 : 2;
    P1.motor.conn = P1.contactor && this.mainBreaker ? 'delta' : 'off';
    P1.motor.step(dt, Tl1, this.elec.V);

    // VFD + secondary pump
    vfd.running = P2.run;
    const hzTarget = P2.run ? clamp(P2.hzCmd, vfd.minHz, vfd.maxHz) : 0;
    if (!this.mainBreaker) { P2.hz = 0; P2.run = false; }
    else P2.hz = P2.hz < hzTarget ? approach(P2.hz, hzTarget, vfd.accel, dt) : approach(P2.hz, hzTarget, vfd.decel, dt);
    const m2 = P2.motor;
    m2.freq = P2.hz; m2.voltScale = clamp(P2.hz / 60, 0, 1) * 0.97 + (P2.hz > 0 ? 0.03 : 0);
    m2.conn = P2.hz > 0.2 ? 'delta' : 'off';
    const n2 = m2.w / (m2.wSync * 0.98);
    const vEff = clamp(this.valve, 0.06, 1);
    const Fs_target = 640 * GPM * clamp(n2, 0, 1.05) * Math.sqrt(vEff) * 1.02;
    this.Fs = lag(this.Fs, Fs_target, 2.5, dt);
    const H2 = 26 * n2 * n2;
    const Tl2 = m2.w > 1 ? (1000 * 9.81 * (this.Fs / 1000) * H2 / 0.72) / m2.w + 1.5 * n2 : 1.5;
    m2.step(dt, Tl2, this.elec.V);
    vfd.kW = m2.Pelec / 0.97 + (P2.run ? 0.25 : 0.05);
    vfd.I = vfd.kW * 1000 / (Math.sqrt(3) * 480 * this.elec.V * 0.95);
    this.bas.dp = Math.max(0, H2 * 1.42 - 8 * (this.Fs / (640 * GPM)) ** 2 * 1.42) * 0.65; // psi at remote sensor (rough)

    // flow switch (thermal dispersion) — slow to make, slower to drop
    const proven = this.Fp > 0.45 * 600 * GPM;
    if (proven !== this.flowSwitch) { this.fsT += dt; if (this.fsT > (proven ? 6 : 6)) { this.flowSwitch = proven; this.fsT = 0; this.ev('relay', 'flowswitch', 0.2); } }
    else this.fsT = 0;

    // ---- loop thermal network ----
    const Fp = this.Fp, Fs = this.Fs;
    const lwt = (this.cooler.A.Tw + this.cooler.B.Tw) / 2;
    let Tevap_in, TsupIn;
    if (Fp >= Fs) {
      Tevap_in = Fp > 0.1 ? (Fs * this.Tret + (Fp - Fs) * lwt) / Fp : this.Tret;
      TsupIn = lwt;
    } else {
      Tevap_in = this.Tret;
      TsupIn = Fs > 0.1 ? (Fp * lwt + (Fs - Fp) * this.Tret) / Fs : this.Tsup;
    }
    // primary loop piping between the decoupler tee and the evaporator (~1.4 m³ of water)
    this.Tprim = this.Tprim ?? Tevap_in;
    this.Tprim += (Math.max(Fp, 0.3) * (Tevap_in - this.Tprim) + 0.2 * (this.roomT - this.Tprim)) / 1400 * dt;
    Tevap_in = this.Tprim;
    this.Tevap_in = Tevap_in;
    // cooler halves (water in tubes)
    for (const c of this.circuits) {
      const h = this.cooler[c.id];
      const F = Fp / 2;
      const Mw = 105;                                             // kg water per half
      const dT = (F * CPW * (Tevap_in - h.Tw) - c.Qevap + 0.15 * (this.roomT - h.Tw)) / (Mw * CPW);
      h.Tw += dT * dt;
    }
    // building coils & mains
    const Ms = 2600, Mr = 3800;           // kg in supply / return mains
    const Fs_ = Math.max(Fs, 0.05);
    const coilCap = this.ahuOn ? this.valve * 52 * this.ahuSpd * Math.max(this.Tzone - this.Tsup, 0) : 0;
    const waterCap = Fs_ * CPW * Math.max(this.Tzone - 0.8 - this.Tsup, 0);
    this.Qcoil = Math.min(coilCap, waterCap);
    const TretBldg = this.Tsup + this.Qcoil / (Fs_ * CPW);
    this.Tsup += (Fs * (TsupIn - this.Tsup) + 0.35 * (this.roomT - this.Tsup)) / (Ms * CPW) * CPW * dt;
    this.Tret += (Fs * (TretBldg - this.Tret) + (Fp > Fs ? 0 : 0) + 0.45 * (this.Tzone - this.Tret)) / (Mr * CPW) * CPW * dt;
    // the decoupler leg also exchanges heat with return when primary > secondary
    if (Fp > Fs) this.Tret += (Fp - Fs) * (lwt - this.Tret) / Mr * dt * 0.0; // (mixing handled at evap inlet)
    // building zone
    const occ = this.bas.occ;
    const h = (this.clock / 3600) % 24;
    const solar = Math.max(0, Math.sin((h - 6.5) / 13 * Math.PI)) * 140;
    const Qint = (occ ? 300 : 55) + solar;
    const Qenv = 13 * (this.oat - this.Tzone);
    const Cb = 260000;                    // kJ/K effective building mass
    this.Tzone += (Qint + Qenv - this.Qcoil) / Cb * dt;
    // AHU valve control (PI on zone temperature)
    const zsp = F2C(72.5);
    if (this.ahuOn) {
      const err = this.Tzone - zsp;
      this.valveInt = clamp(this.valveInt + err * 0.0009 * dt, 0, 1);
      this.valve = clamp(0.35 * err + this.valveInt, 0, 1);
    } else { this.valve = lag(this.valve, 0, 5, dt); }
  }

  // ---------------- sensors ----------------
  updateSensors(dt) {
    const lwt = (this.cooler.A.Tw + this.cooler.B.Tw) / 2;
    this.lwtSensor = lag(this.lwtSensor, lwt, 7, dt);
    this.ewtSensor = lag(this.ewtSensor, this.Tevap_in ?? this.Tret, 7, dt);
  }

  // =====================================================================
  //  BAS — chilled water plant sequence (field programmed, not Carrier)
  // =====================================================================


  // =====================================================================
  //  BAS — field program (inferred from what is heard in the room)
  // =====================================================================
  updateBAS(dt) {
    const b = this.bas, P1 = this.P1, P2 = this.P2, c = this.ctl;
    if (!this.mainBreaker) {
      this.basPowered = false; b.seq = 'OFF'; b.t = 0; P2.run = false; c.ext = false;
      this.ahuOn = false; this.ahuSpd = lag(this.ahuSpd, 0, 6, dt); P2.hzCmd = 0;
      return;
    }
    if (!this.basPowered) { this.basPowered = true; this.basBoot = 25; }
    if (this.basBoot > 0) { this.basBoot -= dt; P2.run = false; c.ext = false; this.ahuOn = false; this.ahuSpd = lag(this.ahuSpd, 0, 6, dt); return; }
    const h = (this.clock / 3600) % 24;
    b.occ = b.mode === 'OCC' ? true : b.mode === 'UNOCC' ? false : (h >= 7 && h < 16.5);
    b.t += dt;
    const go = s => { b.seq = s; b.t = 0; };
    const p1Proven = P1.contactor && this.flowSwitch;
    switch (b.seq) {
      case 'OFF':
        P2.run = false; c.ext = false;
        if (b.occ) { go('ENABLE'); c.ext = true; this.ev('relay', 'bas', 0.4); }
        break;
      case 'ENABLE':                       // chiller enabled → its pump relay starts CHWP-1
        c.ext = true;
        if (p1Proven && b.t > 20) { go('RUN'); b.speedCmd = 0.86; this.ev('relay', 'bas', 0.4); }
        if (!b.occ) go('STOP_WAIT');
        break;
      case 'RUN': {
        c.ext = true; P2.run = true;
        b.speedCmd = clamp(b.speedCmd + (b.dpSP - b.dp) * 0.00025 * dt, 0.55, 1.0);
        if (!b.occ) { go('STOP_WAIT'); this.ev('relay', 'bas', 0.6); }
        break;
      }
      case 'STOP_WAIT':                    // VFD to minimum now, drop chiller enable after a delay
        b.speedCmd = 0.2; P2.run = true;
        if (b.t > b.stopDelay) c.ext = false;
        if (c.ext === false && !P1.contactor) { go('OFF'); P2.run = false; }
        if (b.occ) { go('RUN'); c.ext = true; }
        break;
    }
    if (b.seq === 'OFF' || b.seq === 'ENABLE') P2.run = false;
    P2.run = P2.hoa === 'HAND' || (P2.hoa === 'AUTO' && P2.run);
    P2.hzCmd = P2.hoa === 'HAND' ? 45 : b.speedCmd * 60;
    this.ahuOn = b.occ && this.flowSwitch && P2.hz > 10;
    this.ahuSpd = lag(this.ahuSpd, this.ahuOn ? 1 : 0, 12, dt);
  }

  // =====================================================================
  //  Tracer CH530-pattern chiller controller
  // =====================================================================
  diag(code, text, { latch = true, circ = null } = {}) {
    const c = this.ctl;
    if (c.alarms.find(a => a.code === code)) return;
    const a = { code, text, t: this.clock, latch, circ };
    c.alarms.push(a); c.history.unshift(a); c.history.length = Math.min(c.history.length, 20);
    if (circ && latch) circ.alarm = a;
    this.ev('alarm', 'chiller', 1);
  }
  clearDiag(code) { const c = this.ctl; const a = c.alarms.find(x => x.code === code); if (a && !a.latch) c.alarms = c.alarms.filter(x => x !== a); }
  resetAlarms() { this.ctl.alarms = this.ctl.alarms.filter(a => !a.latch && a.code === 'FLOW'); for (const k of this.circuits) k.alarm = null; this.ev('relay', 'chiller', 0.3); }
  unitEnabled() {
    const c = this.ctl;
    return c.estop && c.frontPanel === 'AUTO' && c.ext && !c.alarms.some(a => a.latch && !a.circ);
  }
  leadLag() {
    const avail = k => !k.alarm;
    const score = k => k.starts * 10 + k.hours;      // "balanced wear"
    let [a, b] = score(this.A) <= score(this.B) ? [this.A, this.B] : [this.B, this.A];
    if (!avail(a) && avail(b)) [a, b] = [b, a];
    return [a, b];
  }

  // circuit-level start sequence
  requestStart(k) {
    if (k.state !== 'OFF' || k.alarm) return false;
    if (this.t - k.startT < this.ctl.restartInhibit) return false;
    k.state = 'WAIT_OIL'; k.tState = 0;
    const offH = Math.min((this.t - k.stopT) / 3600, 10);
    k.oilWait = clamp(4 + offH * 9 + Math.random() * 40, 2, 120);   // "Start Inhibited Waiting For Oil" (≤ 2 min)
    k.fanStage = clamp(Math.round((this.oatF - 45) / 9), 0, 7);      // condenser fan pre-flow per OAT
    return true;
  }
  contactorsOff(k) {
    if (k.c1M) this.ev('contactor', 'comp' + k.id, 1.0);
    k.c1M = k.cS = k.c2M = k.cTR = false; k.motor.conn = 'off';
  }
  stopCircuit(k, why, abrupt = false) {
    this.contactorsOff(k);
    k.exvTarget = 0; if (abrupt) k.exv = 0;
    if (k.stepSol) this.ev('solenoid', 'step' + k.id, 0.5);
    k.stepSol = false; k.unloadSol = true; k.loadPulse = 0;
    k.oilFill = k.oilDrain = false; k.oilHeater = true;
    k.state = 'OFF'; k.tState = 0; k.stopT = this.t; k.lastStop = why; k.forced = '';
    k.fanStage = 0; for (let i = 0; i < 7; i++) k.fanCmd[i] = false;
  }
  beginRunUnload(k) {
    if (k.state !== 'RUN' && k.state !== 'STARTING') { if (k.state !== 'RUN_UNLOAD' && k.state !== 'PUMPDOWN') this.stopCircuit(k, 'NORMAL'); return; }
    if (k.stepSol || !k.unloadSol) this.ev('solenoid', 'step' + k.id, 0.6);
    k.stepSol = false; k.unloadSol = true; k.loadPulse = -1;
    k.state = 'RUN_UNLOAD'; k.tState = 0;
  }

  sequenceCircuit(k, dt) {
    const c = this.ctl;
    k.tState += dt;
    switch (k.state) {
      case 'WAIT_OIL':
        k.oilHeater = true;
        if (k.tState >= k.oilWait) { k.state = 'PREPOS'; k.tState = 0; k.exvTarget = 0.32; k.oilFill = true; k.unloadSol = true; this.ev('solenoid', 'oil' + k.id, 0.3); }
        break;
      case 'PREPOS':                                      // EXV stroke to pre-position (0–20 s)
        if (Math.abs(k.exv - k.exvTarget) < 0.005 && k.tState > 1) {
          if (k.Psuc < R134a.psat(c.lrtc) - 40) { this.diag('LPC' + k.id, `Low Pressure Cutout - Circuit ${k.id === 'A' ? 1 : 2}`, { circ: k }); this.stopCircuit(k, 'LPC'); break; }
          k.c1M = true; k.cS = true; k.motor.conn = 'wye';           // 1M + S: motor in wye
          k.oilDrain = true; k.oilHeater = false;
          k.state = 'STARTING'; k.tState = 0; k.startT = this.t; k.starts++; k.iLowT = 0;
          this.ev('contactor', 'comp' + k.id, 1.0);
        }
        break;
      case 'STARTING': {
        // transition when the motor is up to speed (current < 85 % RLA) or the max acceleration timer runs out
        if (k.cS) {
          k.iLowT = k.motor.I < 0.85 * k.motor.ratedA && k.tState > 0.4 ? k.iLowT + dt : 0;
          const forced = k.tState >= c.maxAccel;
          if (k.iLowT > 0.15 || forced) {
            if (forced) this.diag('ACC' + k.id, `Compressor Did Not Accelerate: Transition - Compressor ${k.name}`, { latch: false });
            k.cTR = true; k.cS = false; k.tTrans = k.tState;               // closed transition: resistors carry the motor
            k.motor.conn = 'delta'; k.motor.inrush = 3.0;
            this.ev('contactor', 'compS' + k.id, 0.75);
          }
        } else if (!k.c2M && k.tState - k.tTrans > 0.08) {
          k.c2M = true; k.cTR = false; this.ev('contactor', 'comp' + k.id, 0.8);
        } else if (k.c2M && k.tState - k.tTrans > 1.0) { k.state = 'RUN'; k.tRun = 0; k.oilFill = false; }
        break;
      }
      case 'RUN':
        k.tRun += dt;
        this.capacityCircuit(k, dt);
        break;
      case 'RUN_UNLOAD':                                  // brief run-unload (5 s) before stopping
        k.stepSol = false; k.unloadSol = true; k.loadPulse = -1;
        if (k.tState >= 6) {
          const last = !this.circuits.some(o => o !== k && o.c1M);
          const needPD = this.oatF < 50 || this.oatF < C2F(this.ewtSensor) + 5;
          if (last && needPD && c.stopping) { k.state = 'PUMPDOWN'; k.tState = 0; k.exvTarget = 0; this.ev('relay', 'exv' + k.id, 0.2); }
          else this.stopCircuit(k, 'NORMAL');
        }
        break;
      case 'PUMPDOWN':                                    // operational pumpdown, 2 min max
        k.exvTarget = 0;
        if ((k.L < 0.22 && C2F(k.Tsuc) < Math.min(32, C2F(c.lrtc) + 4)) || k.tState > 120) this.stopCircuit(k, 'PUMPDOWN');
        break;
      case 'OFF':
        k.oilHeater = true;
        break;
    }
    // ---- EXV liquid-level control (running) ----
    if (k.state === 'RUN' || k.state === 'STARTING' || k.state === 'RUN_UNLOAD') {
      const err = 0.45 - k.L;                             // level below set point → open
      k.exvInt = clamp(k.exvInt + err * 0.006 * dt, 0.05, 1);
      let tgt = clamp(k.exvInt + err * 0.9, 0.05, 1);
      // EXV controlling for low evaporator pressure (protect against LRTC)
      if (k.Tsuc < c.lrtc + 2 / 1.8) tgt = Math.max(tgt, k.exv + 0.02);
      k.exvTarget = tgt;
    } else if (k.state === 'PREPOS') k.exvInt = k.exvTarget;
    // ---- condenser fan staging (integral fan control, fixed-speed fans) ----
    if (k.state === 'PREPOS' || k.state === 'STARTING' || k.state === 'RUN' || k.state === 'RUN_UNLOAD' || k.state === 'PUMPDOWN') {
      k.fanT += dt;
      const sctF = C2F(k.Tcond);
      const target = clamp(this.oatF + 22, 88, 120);       // keep enough differential pressure, but no higher than needed
      if (k.state !== 'PREPOS' && k.fanT > 10) {
        if (sctF > target + 5 && k.fanStage < 7) { k.fanStage++; k.fanT = 0; }
        else if (sctF < target - 8 && k.fanStage > 1 && k.fanT > 20) { k.fanStage--; k.fanT = 0; }
      }
      for (let i = 0; i < 7; i++) k.fanCmd[i] = i < k.fanStage;
    }
    // ---- protections ----
    if (k.c1M) {
      if (k.Pcond > c.hpc) { this.diag('HPC' + k.id, `High Pressure Cutout - Compressor ${k.name}`, { circ: k }); this.stopCircuit(k, 'HPC', true); return; }
      if (k.Tsuc < c.lrtc && k.tRun > 30) k.lowRTt += dt; else k.lowRTt = Math.max(0, k.lowRTt - dt);
      if (k.lowRTt > 30) { this.diag('LRT' + k.id, `Low Evaporator Refrigerant Temperature - Circuit ${k.id === 'A' ? 1 : 2}`, { circ: k }); this.stopCircuit(k, 'LRTC', true); return; }
      if (k.Tmotor > F2C(250)) { this.diag('MTR' + k.id, `Motor Temperature - Compressor ${k.name}`, { circ: k }); this.stopCircuit(k, 'MTR', true); return; }
    }
  }

  // per-compressor capacity: female step + slide valve pulses
  capacityCircuit(k, dt) {
    const c = this.ctl;
    const dP = k.Pcond - k.Psuc;
    // limits
    if (k.Pcond > 0.92 * c.hpc) k.hpLim = true; else if (k.Pcond < 0.88 * c.hpc) k.hpLim = false;
    if (k.Tsuc < c.lrtc + 3 / 1.8) k.lrLim = true; else if (k.Tsuc > c.lrtc + 6 / 1.8) k.lrLim = false;
    const hpLimit = k.hpLim, lrLimit = k.lrLim;
    k.limT = hpLimit || lrLimit ? (k.limT || 0) + dt : 0;
    const curLimit = k.rla > 120;
    const hotStart = C2F(this.lwtSensor) > 90;
    const limited = hpLimit || lrLimit || curLimit;
    k.forced = hpLimit ? 'High Condenser Pressure Limit' : lrLimit ? 'Low Evaporator Rfgt Temperature Limit' : curLimit ? 'Current Limit' : hotStart ? 'Hot Start Limit' : '';
    // "Establishing Min Cap - Low Diff Pressure": force to the step load point to develop pressure sooner
    const lowDP = k.tRun > 3 && dP < 170;
    if (lowDP) k.lowDP = true; else if (dP > 240) k.lowDP = false;
    let wantStep = k.stepSol ? k.capDes > 0.46 : (k.capDes > 0.66 && k.tRun > 30);
    if (hotStart) wantStep = wantStep && k.stepSol && !hotStart;
    if (limited && !k.stepSol) wantStep = false;                          // limits: no further loading
    if (limited && k.stepSol && k.slide < 0.02 && k.limT > 10) wantStep = false;  // fully unloaded slide & still limited → drop the step
    if (k.lowDP && !limited) { wantStep = true; k.forced = 'Establishing Min Cap - Low Diff Pressure'; }
    if (wantStep !== k.stepSol) { k.stepSol = wantStep; this.ev('solenoid', 'step' + k.id, 0.6); }
    // slide valve: load / unload pulses toward the requested capacity
    if (k.stepSol) {
      const slideTgt = k.lowDP && k.capDes < 0.58 ? 0 : clamp((k.capDes - 0.58) / 0.42, 0, 1);
      const e = slideTgt - k.slide;
      k.loadPulse = limited ? -1 : e > 0.03 ? 1 : e < -0.03 ? -1 : 0;
      k.unloadSol = k.loadPulse < 0;
    } else { k.loadPulse = -1; k.unloadSol = true; }
  }

  updateController(dt) {
    const c = this.ctl;
    const chPow = this.mainBreaker && this.chillerDisc;
    if (!chPow) {
      if (this.ctlPowered) {
        for (const k of this.circuits) if (k.c1M || k.state !== 'OFF') { this.stopCircuit(k, 'POWER LOSS', true); }
        if (this.circuits.some(k => k.lastStop === 'POWER LOSS')) this.diag('PWR', 'Momentary Power Loss', { latch: false });
        c.mode = 'Stopped'; c.sub = 'No Power'; c.pumpRelay = false; c.D = 0; this.ctlPowered = false;
      }
      for (const k of this.circuits) { k.oilHeater = false; }
      return;
    }
    if (!this.ctlPowered) { this.ctlPowered = true; this.ctlBoot = 40; this.ev('relay', 'chiller', 0.3); }
    if (this.ctlBoot > 0) { this.ctlBoot -= dt; c.mode = 'Power Up'; c.sub = ''; return; }
    if (!this.mainBreaker) return;
    this.clearDiag('PWR');

    // emergency stop: immediate, latching
    if (!c.estop) {
      if (this.circuits.some(k => k.c1M || k.state !== 'OFF')) for (const k of this.circuits) this.stopCircuit(k, 'ESTOP', true);
      this.diag('ESTOP', 'Emergency Stop Input', {});
    }
    const en = this.unitEnabled();
    const [lead, lag_] = this.leadLag();
    for (const k of this.circuits) this.sequenceCircuit(k, dt);
    const running = this.circuits.filter(k => k.c1M);
    const anyActive = this.circuits.some(k => k.state !== 'OFF');

    // ---- evaporator water pump relay ----
    if (en) { c.pumpRelay = true; c.pumpOffT = 0; }
    else if (!anyActive) { c.pumpOffT += dt; if (c.pumpOffT >= c.pumpOffDelay) c.pumpRelay = false; }
    if (c.alarms.some(a => a.code.startsWith('LWT'))) c.pumpRelay = true;   // diagnostic pump override

    // ---- evaporator flow proving / loss ----
    if (c.pumpRelay && !this.flowSwitch) {
      c.waitFlowT += dt;
      if (running.length) { c.noFlowT += dt; if (c.noFlowT > 6) { this.diag('FLOW', 'Evaporator Water Flow Lost', { latch: false }); for (const k of this.circuits) this.stopCircuit(k, 'FLOW', true); } }
      if (c.waitFlowT > 1200) this.diag('FLOWO', 'Evaporator Water Flow Overdue', { latch: false });
    } else { c.waitFlowT = 0; c.noFlowT = 0; if (this.flowSwitch) { this.clearDiag('FLOW'); this.clearDiag('FLOWO'); } }
    const flowOK = this.flowSwitch && !c.alarms.some(a => a.code === 'FLOW');

    // ---- low leaving water cutout ----
    if (running.length && this.lwtSensor < c.lwtCutout) { this.diag('LWT', 'Low Evaporator Leaving Water Temperature: Unit On'); for (const k of this.circuits) this.stopCircuit(k, 'LWT', true); }

    // ---- chiller-level modes ----
    if (!en) {
      c.D = 0;
      if (anyActive) {
        c.stopping = true;
        c.mode = 'Shutting Down';
        for (const k of this.circuits) if (k.state === 'RUN' || k.state === 'STARTING') this.beginRunUnload(k);
        for (const k of this.circuits) if (k.state === 'WAIT_OIL' || k.state === 'PREPOS') this.stopCircuit(k, 'NORMAL');
        c.sub = this.circuits.some(k => k.state === 'PUMPDOWN') ? 'Operational Pumpdown' : 'Compressor Unloading';
      } else {
        c.stopping = false;
        if (c.pumpRelay) { c.mode = 'Shutting Down'; { const r = Math.max(0, Math.ceil(c.pumpOffDelay - c.pumpOffT)); c.sub = anyActive ? c.sub : `Evap Pump Off Delay ${Math.floor(r / 60)}:${String(r % 60).padStart(2, '0')}`; if (c.alarms.some(a => a.code === 'LWT')) c.sub = 'Diagnostic Evap Water Pump Override'; } }

// =====================================================================
//  STATIC MERGE — bake non-moving meshes into one draw call per material
// =====================================================================
function mergeStatic() {
  const animSet = new Set([
    anim.comp.A.inner, anim.comp.B.inner, anim.P1.g, anim.P2.g, anim.ahuWheel, anim.exhaust,
    anim.isoValve.g, anim.mainBreaker, anim.condFanBreaker, anim.chillerDisc, anim.hoa1, anim.estopTog,
    anim.clock.hh, anim.clock.mh, anim.clock.sh, anim.ballValveA, anim.ballValveB, anim.ahuValveActuator,
    ...Object.values(anim.gauges).map(g => g.pivot), anim.manifold.lo.pivot, anim.manifold.hi.pivot,
  ]);
  const clickSet = new Set(clickables);
  const isAnimated = o => { while (o) { if (animSet.has(o)) return true; o = o.parent; } return false; };
  scene.updateMatrixWorld(true);
  const groups = new Map();
  scene.traverse(o => {
    if (!o.isMesh || clickSet.has(o) || isAnimated(o) || Array.isArray(o.material)) return;
    if (!groups.has(o.material)) groups.set(o.material, []);
    groups.get(o.material).push(o);
  });
  let removed = 0;
  for (const [mat, arr] of groups) {
    if (arr.length < 2) continue;
    const geos = [];
    for (const m of arr) {
      let g = m.geometry.index ? m.geometry.toNonIndexed() : m.geometry.clone();
      for (const k of Object.keys(g.attributes)) if (!['position', 'normal', 'uv'].includes(k)) g.deleteAttribute(k);
      if (!g.attributes.uv) g.setAttribute('uv', new THREE.Float32BufferAttribute(new Float32Array(g.attributes.position.count * 2), 2));
      if (!g.attributes.normal) g.computeVertexNormals();
      g.applyMatrix4(m.matrixWorld);
      geos.push(g);
    }
    const merged = mergeGeometries(geos, false);
    if (!merged) continue;
    const mesh = new THREE.Mesh(merged, mat); mesh.matrixAutoUpdate = false; scene.add(mesh);
    for (const m of arr) { m.parent.remove(m); m.geometry.dispose(); removed++; }
  }
  return removed;
}

// =====================================================================
//  AUDIO — all sound is synthesised from the simulation state
// =====================================================================
class PlantAudio {
  constructor() { this.ctx = null; this.ready = false; this.src = {}; }
  start() {
    if (this.ready) { if (this.ctx.state !== 'running') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    const ctx = this.ctx = new AC();
    this.master = ctx.createGain(); this.master.gain.value = 0.9;
    const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4; comp.attack.value = 0.005; comp.release.value = 0.2;
    this.master.connect(comp); comp.connect(ctx.destination);
    // white & pink noise buffers
    const len = ctx.sampleRate * 3;
    this.white = ctx.createBuffer(1, len, ctx.sampleRate);
    const w = this.white.getChannelData(0); for (let i = 0; i < len; i++) w[i] = Math.random() * 2 - 1;
    this.pink = ctx.createBuffer(1, len, ctx.sampleRate);
    const p = this.pink.getChannelData(0); let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0;
    for (let i = 0; i < len; i++) { const x = Math.random() * 2 - 1; b0 = 0.99886 * b0 + x * 0.0555179; b1 = 0.99332 * b1 + x * 0.0750759; b2 = 0.969 * b2 + x * 0.153852; b3 = 0.8665 * b3 + x * 0.3104856; b4 = 0.55 * b4 + x * 0.5329522; b5 = -0.7616 * b5 - x * 0.016898; p[i] = (b0 + b1 + b2 + b3 + b4 + b5 + x * 0.5362) * 0.11; }
    this.build();
    this.ready = true;
  }
  panner(pos) {
    const pn = this.ctx.createPanner();
    pn.panningModel = 'HRTF'; pn.distanceModel = 'inverse'; pn.refDistance = 1.6; pn.rolloffFactor = 1.1; pn.maxDistance = 60;
    pn.positionX.value = pos.x; pn.positionY.value = pos.y; pn.positionZ.value = pos.z;
    pn.connect(this.master); return pn;
  }
  noise(pink = false) { const s = this.ctx.createBufferSource(); s.buffer = pink ? this.pink : this.white; s.loop = true; s.loopStart = Math.random(); s.start(0, Math.random() * 2); return s; }
  filt(type, f, q = 0.7) { const b = this.ctx.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; return b; }
  gain(v = 0) { const g = this.ctx.createGain(); g.gain.value = v; return g; }
  osc(type, f) { const o = this.ctx.createOscillator(); o.type = type; o.frequency.value = f; o.start(); return o; }
  chain(...n) { for (let i = 0; i < n.length - 1; i++) n[i].connect(n[i + 1]); return n[n.length - 1]; }
  set(param, v, tc = 0.04) { if (!isFinite(v)) v = 0; param.setTargetAtTime(v, this.ctx.currentTime, tc); }

  build() {
    const P = this.positions;
        // ---- screw compressors ----
    // Spectrum measured from the recording of the real compressor (unloaded, through the door):
    // lobe-passing tone at 5 × shaft speed (≈298 Hz) with strong ODD harmonics
    // (3rd −6 dB, 5th −19, 7th −30, 11th −39, 13th −40) and weak even ones (≈ −32 dB),
    // amplitude-modulated at the 7-lobe female rotor speed (≈42.6 Hz). The in-room versions
    // below restore the high harmonics the door absorbed (+6 dB ≥1.2 kHz, +10 dB ≥2 kHz).
    const dB = d => Math.pow(10, d / 20);
    const mkWave = (levels) => { const re = new Float32Array(levels.length + 1), im = new Float32Array(levels.length + 1); levels.forEach((l, i) => { im[i + 1] = l == null ? 0 : dB(l); }); return this.ctx.createPeriodicWave(re, im, { disableNormalization: true }); };
    const unloadedWave = mkWave([0, -32, -6, -26, -13, -39, -20, -29, -35, -38, -29, -45, -30, -42, -40, -46]);
    const loadedWave = mkWave([0, -30, -14, -30, -24, -42, -33, -38, -44, -46, -42, -50, -44, -50, -50, -55]);
    for (const id of ['A', 'B']) {
      const out = this.panner(this.positions['comp' + id]);
      const s = { tU: this.gain(), tL: this.gain(), am: this.gain(1), roar: this.gain(), hiss: this.gain(), hum: this.gain(), hum2: this.gain(), rot: this.gain() };
      s.oU = this.osc('sine', 298); s.oU.setPeriodicWave(unloadedWave);
      s.oL = this.osc('sine', 298); s.oL.setPeriodicWave(loadedWave);
      s.oU.connect(s.tU); s.oL.connect(s.tL); s.tU.connect(s.am); s.tL.connect(s.am);
      s.am.connect(out);
      // female-rotor flutter (amplitude modulation of the tonal part)
      s.fem = this.osc('sine', 42.6); s.femG = this.gain(0); s.fem.connect(s.femG); s.femG.connect(s.am.gain);
      // broadband gas noise (≈35 dB under the tone in the recording)
      this.chain(this.noise(true), this.filt('bandpass', 700, 0.5), s.roar, out);
      this.chain(this.noise(false), this.filt('bandpass', 2600, 0.7), s.hiss, out);
      s.h120 = this.osc('sine', 120); this.chain(s.h120, s.hum, out);
      s.h240 = this.osc('sine', 240); this.chain(s.h240, s.hum2, out);
      s.r = this.osc('sine', 59.6); this.chain(s.r, s.rot, out);
      this.src['comp' + id] = s;
    }
    // ---- primary pump (across the line) ----
    {
      const out = this.panner(P.P1);
      const s = { flow: this.gain(), vane: this.gain(), hum: this.gain(), fan: this.gain() };
      this.chain(this.noise(true), this.filt('lowpass', 650, 0.7), s.flow, out);
      s.v = this.osc('sine', 208); this.chain(s.v, s.vane, out);
      s.h = this.osc('sine', 120); this.chain(s.h, s.hum, out);
      this.chain(this.noise(false), this.filt('bandpass', 1100, 0.8), s.fan, out);
      this.src.P1 = s;
    }
    // ---- secondary pump on VFD (motor magnetic whine tracks output frequency) ----
    {
      const out = this.panner(P.P2);
      const s = { flow: this.gain(), vane: this.gain(), fan: this.gain(), mag2: this.gain(), mag12: this.gain(), mag24: this.gain(), carrier: this.gain(), carAM: this.gain(0.5) };
      this.chain(this.noise(true), this.filt('lowpass', 700, 0.7), s.flow, out);
      s.v = this.osc('triangle', 175); this.chain(s.v, s.vane, out);
      this.chain(this.noise(false), this.filt('bandpass', 1100, 0.8), s.fan, out);
      s.m2 = this.osc('sine', 120); this.chain(s.m2, s.mag2, out);
      s.m12 = this.osc('sawtooth', 600); this.chain(s.m12, this.filt('bandpass', 900, 1.2), s.mag12, out);
      s.m24 = this.osc('sine', 1200); this.chain(s.m24, s.mag24, out);
      // PWM carrier tone radiated by the motor, amplitude-modulated at 2×f_out
      s.car = this.osc('sine', 3000); s.car.connect(s.carAM); s.carAM.connect(s.carrier); s.carrier.connect(out);
      s.carLfo = this.osc('sine', 120); s.carLfoG = this.gain(0.45); s.carLfo.connect(s.carLfoG); s.carLfoG.connect(s.carAM.gain);
      this.src.P2 = s;
      // the drive itself: heatsink fan + inductor whine
      const vout = this.panner(P.VFD);
      const d = { fan: this.gain(), whine: this.gain() };
      this.chain(this.noise(false), this.filt('bandpass', 2400, 0.7), d.fan, vout);
      d.w = this.osc('sine', 3000); this.chain(d.w, d.whine, vout);
      this.src.VFD = d;
    }
    // ---- oil pumps ----
    for (const id of ['A', 'B']) {
      const out = this.panner(P['oilpump' + id]);
      const s = { g: this.gain() };
      s.o = this.osc('sawtooth', 58); this.chain(s.o, this.filt('lowpass', 900, 1), s.g, out);
      s.w = this.osc('sine', 870); s.wg = this.gain(); this.chain(s.w, s.wg, out);
      this.src['oil' + id] = s;
    }
    // ---- AHU, exhaust fan, transformer, room tone ----
    {
      const out = this.panner(P.AHU);
      const s = { rumble: this.gain(), air: this.gain(), bpf: this.gain() };
      this.chain(this.noise(true), this.filt('lowpass', 260, 0.8), s.rumble, out);
      this.chain(this.noise(false), this.filt('bandpass', 700, 0.5), s.air, out);
      s.b = this.osc('sine', 46); this.chain(s.b, s.bpf, out);
      this.src.AHU = s;
      const eo = this.panner(P.EF); const e = { g: this.gain() }; this.chain(this.noise(true), this.filt('bandpass', 420, 0.6), e.g, eo); this.src.EF = e;
      const to = this.panner(P.T1); const t = { g: this.gain(), g2: this.gain() };
      t.o = this.osc('sine', 120); this.chain(t.o, t.g, to); t.o2 = this.osc('sine', 240); this.chain(t.o2, t.g2, to); this.src.T1 = t;
      const room = this.gain(0.02); this.chain(this.noise(true), this.filt('lowpass', 180, 0.5), room, this.master); this.src.room = room;
      const buzz = this.gain(0); this.chain(this.osc('sawtooth', 120), this.filt('bandpass', 240, 2), buzz, this.master); this.src.buzz = buzz;
      // alarm beeper at control box
      const ao = this.panner(P.CB); const a = { g: this.gain() }; a.o = this.osc('square', 2900); this.chain(a.o, this.filt('lowpass', 5000), a.g, ao); this.src.alarm = a;
    }
  }

  update(plant, cam, ui) {
    if (!this.ready) return;
    const ctx = this.ctx, L = ctx.listener;
    const p = cam.position, f = new THREE.Vector3(0, 0, -1).applyQuaternion(cam.quaternion), u = new THREE.Vector3(0, 1, 0).applyQuaternion(cam.quaternion);
    if (L.positionX) { const t = ctx.currentTime; L.positionX.setTargetAtTime(p.x, t, 0.02); L.positionY.setTargetAtTime(p.y, t, 0.02); L.positionZ.setTargetAtTime(p.z, t, 0.02); L.forwardX.setTargetAtTime(f.x, t, 0.02); L.forwardY.setTargetAtTime(f.y, t, 0.02); L.forwardZ.setTargetAtTime(f.z, t, 0.02); L.upX.setTargetAtTime(u.x, t, 0.02); L.upY.setTargetAtTime(u.y, t, 0.02); L.upZ.setTargetAtTime(u.z, t, 0.02); }
    else { L.setPosition(p.x, p.y, p.z); L.setOrientation(f.x, f.y, f.z, u.x, u.y, u.z); }
    const V = plant.elec.V;
    // compressors
    for (const c of plant.circuits) {
      const s = this.src['comp' + c.id], n = c.noise;
      const wr = c.motor.w / c.w0;
      const mixU = clamp(n.harm, 0, 1.2);                  // pulsation richness → unloaded timbre
      this.set(s.tU.gain, 0.16 * n.tone * clamp(mixU, 0, 1));
      this.set(s.tL.gain, 0.16 * n.tone * clamp(1 - mixU, 0, 1) + 0.05 * wr * wr);
      this.set(s.femG.gain, 0.22 * clamp(n.tone, 0, 1));
      this.set(s.roar.gain, 0.10 * n.roar);
      this.set(s.hiss.gain, 0.03 * n.roar);
      this.set(s.hum.gain, 0.05 * n.hum); this.set(s.hum2.gain, 0.02 * n.hum);
      this.set(s.rot.gain, 0.05 * wr * wr);
      const lob = Math.max(n.lobeHz || 1, 1);
      this.set(s.oU.frequency, lob, 0.02); this.set(s.oL.frequency, lob, 0.02);
      this.set(s.fem.frequency, Math.max(n.femHz || 1, 0.5), 0.05);
      this.set(s.r.frequency, Math.max(n.rotHz || 1, 1), 0.02);
      this.set(s.h120.frequency, 120 * Math.max(V, 0.5));
    }
    // primary pump
    {
      const m = plant.P1.motor, n = m.w / (m.wSync * 0.975), s = this.src.P1;
      this.set(s.flow.gain, 0.10 * n * n);
      this.set(s.vane.gain, 0.03 * n * n); this.set(s.v.frequency, Math.max(plant.P1.vanes * m.rpm / 60, 1));
      this.set(s.hum.gain, m.conn === 'delta' ? 0.05 * V : 0);
      this.set(s.fan.gain, 0.05 * n * n);
    }
    // secondary pump + VFD
    {
      const m = plant.P2.motor, hz = plant.P2.hz, n = m.w / (m.wSync * 0.98), s = this.src.P2, d = this.src.VFD;
      const load = Math.min(1, m.I / m.ratedA);
      this.set(s.flow.gain, 0.10 * n * n);
      this.set(s.vane.gain, 0.022 * n * n); this.set(s.v.frequency, Math.max(6 * m.rpm / 60, 1));
      this.set(s.fan.gain, 0.05 * n * n);
      const on = hz > 0.3 ? 1 : 0;
      this.set(s.mag2.gain, on * (0.03 + 0.03 * load)); this.set(s.m2.frequency, Math.max(2 * hz, 1));
      this.set(s.mag12.gain, on * (0.035 + 0.02 * (1 - hz / 60))); this.set(s.m12.frequency, Math.max(12 * hz, 1));
      this.set(s.mag24.gain, on * 0.018); this.set(s.m24.frequency, Math.max(24 * hz, 1));
      this.set(s.carrier.gain, on * 0.022); this.set(s.carLfo.frequency, Math.max(2 * hz, 1));
      this.set(d.fan.gain, plant.vfd.running || hz > 0 ? 0.035 : 0);
      this.set(d.whine.gain, on * 0.008);
    }
    for (const c of plant.circuits) { const s = this.src['oil' + c.id]; this.set(s.g.gain, c.oilPump && V > 0.5 ? 0.04 : 0); this.set(s.wg.gain, c.oilPump && V > 0.5 ? 0.012 : 0); }
    { const s = this.src.AHU, a = plant.ahuSpd; this.set(s.rumble.gain, 0.16 * a * a); this.set(s.air.gain, 0.06 * a * a); this.set(s.bpf.gain, 0.03 * a); this.set(s.b.frequency, Math.max(46 * a, 1)); }
    this.set(this.src.EF.g.gain, ui.exhaustSpd * 0.05);
    this.set(this.src.T1.g.gain, plant.mainBreaker ? 0.03 + plant.elec.I / 1500 * 0.03 : 0); this.set(this.src.T1.g2.gain, plant.mainBreaker ? 0.012 : 0);
    this.set(this.src.buzz.gain, ui.lightsOn && plant.mainBreaker ? 0.004 : 0);
    const alarmOn = plant.ctl.alarms.length > 0 && plant.ctlPowered && (Math.floor(ctx.currentTime * 2) % 2 === 0);
    this.set(this.src.alarm.g.gain, alarmOn ? 0.012 : 0, 0.005);
  }

  // ---------- one-shot mechanical sounds ----------
  oneShot(type, pos, gain = 1) {
    if (!this.ready) return;
    const ctx = this.ctx, t = ctx.currentTime;
    const out = this.ctx.createPanner(); out.panningModel = 'HRTF'; out.distanceModel = 'inverse'; out.refDistance = 1.2; out.rolloffFactor = 1.1;
    out.positionX.value = pos.x; out.positionY.value = pos.y; out.positionZ.value = pos.z; out.connect(this.master);
    const burst = (dur, filterType, f, q, amp, delay = 0) => {
      const s = ctx.createBufferSource(); s.buffer = this.white; const fl = this.filt(filterType, f, q); const g = this.gain(0);
      s.connect(fl); fl.connect(g); g.connect(out);
      g.gain.setValueAtTime(0, t + delay); g.gain.linearRampToValueAtTime(amp, t + delay + 0.002); g.gain.exponentialRampToValueAtTime(0.0001, t + delay + dur);
      s.start(t + delay, Math.random()); s.stop(t + delay + dur + 0.05);
    };
    const tone = (f0, f1, dur, amp, type = 'sine', delay = 0) => {
      const o = ctx.createOscillator(); o.type = type; const g = this.gain(0); o.connect(g); g.connect(out);
      o.frequency.setValueAtTime(f0, t + delay); o.frequency.exponentialRampToValueAtTime(f1, t + delay + dur);
      g.gain.setValueAtTime(0, t + delay); g.gain.linearRampToValueAtTime(amp, t + delay + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t + delay + dur);
      o.start(t + delay); o.stop(t + delay + dur + 0.05);
    };
    switch (type) {
      case 'contactor':   // big 3-pole contactor slam
        burst(0.09, 'lowpass', 2600, 0.7, 0.55 * gain); tone(140, 70, 0.12, 0.35 * gain); burst(0.03, 'highpass', 3000, 0.7, 0.2 * gain, 0.012); break;
      case 'thud':        // across-the-line pump start: contactor + shaft torque kick through the base
        burst(0.08, 'lowpass', 2200, 0.7, 0.4 * gain); tone(65, 32, 0.38, 0.75 * gain); tone(110, 60, 0.18, 0.25 * gain); break;
      case 'solenoid':    // solenoid valve / loader coil click
        burst(0.014, 'highpass', 1500, 0.7, 0.35 * gain); tone(2200, 1700, 0.04, 0.08 * gain, 'triangle'); burst(0.05, 'bandpass', 600, 2, 0.08 * gain, 0.004); break;
      case 'relay':
        burst(0.008, 'highpass', 2500, 0.7, 0.18 * gain); break;
      case 'switch':
        burst(0.02, 'bandpass', 1800, 1.2, 0.3 * gain); tone(900, 600, 0.03, 0.06 * gain, 'triangle'); break;
      case 'breaker':
        burst(0.06, 'lowpass', 3000, 0.6, 0.6 * gain); tone(220, 90, 0.1, 0.3 * gain); break;
      case 'key':
        burst(0.01, 'bandpass', 2500, 1, 0.15 * gain); break;
      case 'alarm': break;
    }
  }
}

  anim.ahuValveActuator.position.y = 1.33 + p.valve * 0.08;
  // isolation valve handwheel & indicator
  anim.isoValve.ind.rotation.y = (1 - p.isoValve) * Math.PI / 2;
  anim.isoValve.wheel.rotation.x = (1 - p.isoValve) * 14;
  // gauges
  const n1 = p.P1.motor.w / (p.P1.motor.wSync * 0.975), n2 = p.P2.motor.w / (p.P2.motor.wSync * 0.98);
  const stat = 28;
  const h1 = 17.5 * n1 * n1 * 1.42, h2 = 26 * n2 * n2 * 1.42;
  const evDrop = 6.5 * (p.Fp / (600 * GPM)) ** 2;
  const G = anim.gauges;
  G.p1s.set(stat - 1.5 * (p.Fp / (600 * GPM)) ** 2, dt); G.p1d.set(stat + h1 * clamp(0.7 + 0.3 * p.isoValve, 0, 1.1), dt);
  G.evIn_p.set(stat + h1 * 0.85 * (p.isoValve > 0.05 ? 1 : 0), dt); G.evOut_p.set(stat + h1 * 0.85 * (p.isoValve > 0.05 ? 1 : 0) - evDrop, dt);
  G.evIn_t.set(C2F(p.Tevap_in ?? p.Tret), dt); G.evOut_t.set(C2F((p.cooler.A.Tw + p.cooler.B.Tw) / 2), dt);
  G.p2s.set(stat + 1, dt); G.p2d.set(stat + 1 + h2, dt);
  G.mag.set(0.12 + 0.55 * p.ahuSpd * p.ahuSpd, dt);
  anim.manifold.lo.set(kPa2psig(p.A.Psuc), dt); anim.manifold.hi.set(kPa2psig(p.A.Pcond), dt);
  // pilot lights
  anim.p1RunLight.material.color.set(p.P1.contactor && p.mainBreaker ? 0x3dff5a : 0x1a3a1a);
  anim.flowLed.material.color.set(!p.mainBreaker ? 0x111100 : p.flowSwitch ? 0xffd21a : p.Fp > 5 ? 0x887a10 : 0x1a8a1a);
  const blink = Math.floor(now * 2) % 2 === 0;
  anim.alarmLight.material.color.set(p.ctl.alarms.length && p.ctlPowered && blink ? 0xff2a1a : 0x3a0e0e);
  anim.powerLight.material.color.set(p.ctlPowered ? 0x3dff5a : 0x113311);
  // wall clock
  const h = (p.clock / 3600) % 12, m = (p.clock / 60) % 60, s = p.clock % 60;
  anim.clock.hh.rotation.z = -h / 12 * Math.PI * 2; anim.clock.mh.rotation.z = -m / 60 * Math.PI * 2; anim.clock.sh.rotation.z = -Math.floor(s) / 60 * Math.PI * 2;
}

// ---------------- main loop ----------------
let last = performance.now(), simAcc = 0;
ui.minV = 1; ui.minVT = 0;
mergeStatic();
setKnob();
drawBAS(); drawDyna(); drawVFD(); drawMeter(); drawLeak();
function frame() {
  const now = performance.now();
  let dt = Math.min((now - last) / 1000, 0.1); last = now;
  // simulation: fixed 10 ms steps
  simAcc += dt * ui.speed;
  const h = 0.01; let steps = 0;
  while (simAcc >= h && steps < 4000) {
    plant.step(h); simAcc -= h; steps++;
    ui.minV = Math.min(ui.minV, plant.elec.V);
    if (plant.events.length) {
      for (const ev of plant.events) audio.oneShot(ev.type, evPos(ev.src), ev.gain);
      plant.events.length = 0;
    }
  }
  ui.minVT += dt; if (ui.minVT > 10) { ui.minVT = 0; ui.minV = plant.elec.V; }
  // trend sampling (every 5 s sim)
  if (plant.clock - ui.trendT >= 5) {
    ui.trendT = plant.clock;
    ui.trend.push({ t: plant.clock, lwt: C2F(plant.lwtSensor), ewt: C2F(plant.ewtSensor), sp: C2F(plant.ctl.setpoint), cap: plant.ctl.capacityPct, sstA: C2F(plant.A.Tsuc) });
    if (ui.trend.length > 800) ui.trend.shift();
  }
  updatePlayer(dt);
  updateVisuals(dt, now / 1000);
  audio.update(plant, camera, ui);
  ui.screenT += dt;
  if (ui.screenT > 0.2) { ui.screenT = 0; drawDyna(); drawBAS(); drawVFD(); drawMeter(); drawLeak(); }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__plant = plant; window.__ui = ui; window.__player = player; window.__scene = scene; window.__renderer = renderer; window.__anim = anim; window.__camera = camera; window.__RC = THREE.Raycaster;

</script>
